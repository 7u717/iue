<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>iue words</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box;margin:0;padding:0; }
    :root {
      --bg:#000;
      --surface:#101010;
      --surface2:#151515;
      --surface3:#1c1c1f;
      --border:rgba(255,255,255,.075);
      --text:#e7e9ea;
      --muted:#71767b;
      --dim:#3f444a;
      --blue:#93c5fd;
      --blue-soft:#0d1f3c;
      --blue2:#60a5fa;
      --blue2-soft:#071a2f;
      --ink:#a7b7c8;
      --ink-soft:#12161b;
      --red:#ff453a;
      --phone-width:420px;
      --header-h:66px;
      --nav-h:56px;
      --radius:16px;
      --shadow:0 0 0 1px var(--border);
    }
    html { background:#000; }
    body {
      width:100%;
      max-width:var(--phone-width);
      height:100dvh;
      min-height:100vh;
      margin:0 auto;
      overflow:hidden;
      position:relative;
      background:var(--bg);
      color:var(--text);
      border-left:1px solid var(--border);
      border-right:1px solid var(--border);
      font-family:'Inter',sans-serif;
      font-size:15px;
      line-height:1.55;
    }
    header {
      position:fixed;
      z-index:100;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      max-width:var(--phone-width);
      height:var(--header-h);
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#000;
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }
    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .avatar {
      width:36px;
      height:36px;
      border-radius:50%;
      display:block;
      overflow:hidden;
      background:#061423;
      flex-shrink:0;
    }
    .avatar img { width:100%;height:100%;object-fit:cover;display:block; }
    .header-actions {
      display:flex;
      align-items:center;
      gap:8px;
    }
    .mini-btn {
      border:1px solid var(--border);
      background:var(--surface2);
      color:var(--text);
      border-radius:10px;
      padding:6px 9px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .mini-btn.primary {
      background:var(--blue-soft);
      color:var(--blue);
      border-color:rgba(147,197,253,.18);
    }
    .screen {
      display:none;
      position:fixed;
      top:var(--header-h);
      bottom:var(--nav-h);
      left:50%;
      transform:translateX(-50%);
      width:100%;
      max-width:var(--phone-width);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:16px;
    }
    .screen.active { display:block; }
    .screen::-webkit-scrollbar { width:3px; }
    .screen::-webkit-scrollbar-thumb { background:rgba(255,255,255,.22);border-radius:999px; }
    .hero {
      background:linear-gradient(180deg,#101010,#0b0b0b);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .hero-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .eyebrow {
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .hero-title {
      margin-top:5px;
      font-family:'Space Grotesk',sans-serif;
      font-size:28px;
      font-weight:800;
      line-height:1.05;
      letter-spacing:0;
    }
    .hero-quote-cn {
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      line-height:1.35;
    }
    .streak {
      min-width:66px;
      text-align:right;
      font-family:'Space Grotesk',sans-serif;
      color:var(--blue);
      font-size:30px;
      font-weight:800;
      line-height:.95;
    }
    .streak span {
      display:block;
      margin-top:5px;
      color:var(--muted);
      font-family:'Inter',sans-serif;
      font-size:11px;
      font-weight:700;
    }
    .progress-track {
      height:7px;
      border-radius:999px;
      background:var(--surface3);
      overflow:hidden;
      margin:10px 0 7px;
    }
    .progress-fill {
      height:100%;
      width:0%;
      border-radius:999px;
      background:var(--blue);
      transition:width .35s ease;
    }
    .hero-meta {
      display:flex;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
      font-weight:650;
    }
    .stats-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-bottom:16px;
    }
    .stat {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      min-width:0;
    }
    .stat-value {
      font-family:'Space Grotesk',sans-serif;
      font-size:24px;
      font-weight:800;
      line-height:1;
    }
    .stat-label {
      margin-top:6px;
      color:var(--muted);
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .section-label {
      margin:18px 2px 10px;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .deck-grid {
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    .deck-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      padding:15px;
      cursor:pointer;
      box-shadow:var(--shadow);
      -webkit-tap-highlight-color:transparent;
    }
    .deck-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .deck-left {
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .deck-icon {
      width:38px;
      height:38px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      font-size:19px;
    }
    .deck-title {
      font-size:16px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .deck-note {
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .deck-count {
      font-family:'Space Grotesk',sans-serif;
      color:var(--text);
      font-weight:800;
      font-size:19px;
      flex-shrink:0;
    }
    .deck-bar {
      height:5px;
      border-radius:999px;
      background:var(--surface3);
      overflow:hidden;
      margin-top:12px;
    }
    .deck-bar > div {
      height:100%;
      width:0%;
      border-radius:999px;
      transition:width .3s ease;
    }
    .quick-list {
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .quick-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      cursor:pointer;
    }
    .quick-item.brief {
      align-items:flex-start;
      color:var(--text);
      text-decoration:none;
    }
    .brief-title {
      color:var(--text);
      font-size:15px;
      font-weight:800;
      line-height:1.3;
    }
    .brief-cn {
      margin-top:8px;
      color:#b9c2cc;
      font-size:13px;
      font-weight:750;
      line-height:1.35;
    }
    .brief-meta {
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      line-height:1.35;
    }
    .brief-cat {
      color:var(--blue);
      background:var(--blue-soft);
      border:1px solid rgba(147,197,253,.16);
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
      flex-shrink:0;
    }
    .quick-word {
      font-size:15px;
      font-weight:800;
    }
    .quick-meaning {
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
    }
    .quick-tag {
      color:var(--blue);
      background:var(--blue-soft);
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:800;
      flex-shrink:0;
    }
    .filter-row {
      position:sticky;
      top:-16px;
      z-index:10;
      display:flex;
      gap:8px;
      padding:12px 0;
      background:#000;
      overflow-x:auto;
      border-bottom:1px solid rgba(255,255,255,.04);
      margin:-16px -16px 12px;
      padding-left:16px;
      padding-right:16px;
    }
    .filter-row::-webkit-scrollbar { display:none; }
    .chip {
      border:1px solid var(--border);
      color:var(--muted);
      background:var(--surface);
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      cursor:pointer;
    }
    .chip.active {
      color:#000;
      background:var(--text);
      border-color:var(--text);
    }
    .word-list {
      display:flex;
      flex-direction:column;
      gap:9px;
      padding-bottom:14px;
    }
    .word-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }
    .word-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:15px;
      cursor:pointer;
    }
    .word-main { min-width:0; }
    .word {
      font-family:'Space Grotesk',sans-serif;
      font-size:21px;
      font-weight:800;
      line-height:1;
    }
    .phonetic {
      margin-top:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:650;
    }
    .meaning {
      margin-top:9px;
      color:var(--text);
      font-size:14px;
      font-weight:700;
    }
    .word-actions {
      display:flex;
      align-items:center;
      gap:7px;
      flex-shrink:0;
    }
    .icon-btn {
      width:34px;
      height:34px;
      border-radius:50%;
      border:1px solid var(--border);
      background:var(--surface2);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:15px;
    }
    .icon-btn.done {
      background:var(--blue-soft);
      color:var(--blue);
      border-color:rgba(147,197,253,.25);
    }
    .word-body {
      display:none;
      padding:0 15px 15px;
      border-top:1px solid var(--border);
    }
    .word-card.open .word-body { display:block; }
    .example {
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .example strong { color:var(--text); }
    .word-meta {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:12px;
    }
    .pill {
      color:var(--muted);
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:800;
    }
    .practice-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
      min-height:330px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .flash-word-card {
      min-height:220px;
      border-radius:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg,#151515,#101010);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:26px 20px;
      cursor:pointer;
      user-select:none;
      transition:transform .16s,border-color .16s;
    }
    .flash-word-card:active { transform:scale(.985); }
    .practice-kind {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:var(--blue);
      background:var(--blue-soft);
      border-radius:999px;
      padding:4px 10px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .prompt {
      margin-top:16px;
      font-family:'Space Grotesk',sans-serif;
      font-size:32px;
      font-weight:800;
      line-height:1.05;
    }
    .prompt-sub {
      margin-top:9px;
      color:var(--muted);
      font-size:14px;
      min-height:43px;
    }
    .card-answer {
      display:none;
      margin-top:16px;
      color:var(--text);
      font-size:15px;
      line-height:1.55;
    }
    .card-answer.show { display:block; }
    .card-example {
      margin-top:8px;
      color:var(--dim);
      font-size:12px;
      font-style:italic;
      line-height:1.45;
    }
    .tap-hint {
      margin-top:14px;
      color:var(--dim);
      font-size:12px;
      font-weight:650;
    }
    .answer-box {
      width:100%;
      margin-top:18px;
      border:1px solid var(--border);
      background:var(--surface2);
      color:var(--text);
      border-radius:14px;
      padding:14px 15px;
      font-family:'Space Grotesk',sans-serif;
      font-size:20px;
      font-weight:750;
      outline:none;
    }
    .answer-box:focus { border-color:rgba(147,197,253,.45); }
    .practice-actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:12px;
    }
    .big-btn {
      border:1px solid var(--border);
      background:var(--surface2);
      color:var(--text);
      border-radius:14px;
      padding:12px 10px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .big-btn.primary {
      background:var(--blue);
      border-color:var(--blue);
      color:#06101c;
    }
    .feedback {
      margin-top:12px;
      padding:12px;
      border-radius:14px;
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--muted);
      font-size:13px;
      display:none;
    }
    .feedback.show { display:block; }
    .feedback.good { color:var(--blue);background:var(--blue-soft);border-color:rgba(147,197,253,.18); }
    .feedback.bad { color:#fda4af;background:#26090d;border-color:rgba(253,164,175,.18); }
    .mode-row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:12px;
    }
    .deck-mode-row {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-bottom:10px;
    }
    .mode-btn {
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--muted);
      border-radius:13px;
      padding:10px 8px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }
    .mode-btn.active {
      color:#000;
      background:var(--text);
      border-color:var(--text);
    }
    .add-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      margin-top:14px;
    }
    .add-grid {
      display:grid;
      grid-template-columns:1fr;
      gap:9px;
      margin-top:10px;
    }
    .field {
      width:100%;
      border:1px solid var(--border);
      border-radius:13px;
      background:var(--surface2);
      color:var(--text);
      padding:11px 12px;
      font-size:14px;
      outline:none;
      font-family:'Inter',sans-serif;
    }
    .field:focus { border-color:rgba(147,197,253,.45); }
    .tab-bar {
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:90;
      max-width:var(--phone-width);
      min-height:var(--nav-h);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      align-items:center;
      padding:6px 30px calc(5px + env(safe-area-inset-bottom));
      background:rgba(0,0,0,.96);
      border-top:1px solid var(--border);
      box-shadow:0 -8px 24px rgba(0,0,0,.62);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
    }
    .tab {
      position:relative;
      top:3px;
      min-height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:0;
      background:transparent;
      color:rgba(231,233,234,.62);
      cursor:pointer;
      transition:color .18s,transform .18s,filter .18s;
      -webkit-tap-highlight-color:transparent;
    }
    .tab:active { transform:translateY(1px) scale(.98); }
    .tab.active {
      color:#1d9bf0;
      filter:drop-shadow(0 0 12px rgba(29,155,240,.55));
    }
    .tab-main {
      width:44px;
      height:44px;
      min-height:44px;
      margin:0 auto;
      border-radius:50%;
      background:rgba(29,155,240,.12);
      box-shadow:inset 0 0 0 1px rgba(29,155,240,.24);
    }
    .tab-main.active {
      background:rgba(29,155,240,.16);
      color:#1d9bf0;
      box-shadow:inset 0 0 0 1px rgba(29,155,240,.38),0 0 18px rgba(29,155,240,.22);
    }
    .nav-icon {
      width:29px;
      height:29px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.85;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.92;
    }
    .tab-main .nav-icon { width:25px;height:25px; }
    .badge {
      position:absolute;
      top:1px;
      right:calc(50% - 18px);
      min-width:17px;
      height:17px;
      padding:0 4px;
      border-radius:999px;
      background:var(--red);
      color:#fff;
      border:2px solid #000;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Space Grotesk',sans-serif;
      font-size:10px;
      font-weight:800;
      line-height:1;
      box-shadow:0 0 10px rgba(255,69,58,.45);
    }
    .toast {
      position:fixed;
      left:50%;
      bottom:calc(var(--nav-h) + 14px);
      transform:translateX(-50%) translateY(10px);
      z-index:200;
      width:calc(100% - 32px);
      max-width:388px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 14px;
      color:var(--text);
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s,transform .2s;
      box-shadow:0 10px 28px rgba(0,0,0,.5);
    }
    .toast.show {
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }
    @media (max-width:520px) {
      :root {
        --header-h:calc(58px + env(safe-area-inset-top));
        --nav-h:calc(56px + env(safe-area-inset-bottom));
      }
      header { padding:calc(10px + env(safe-area-inset-top)) 18px 10px; }
      .screen { padding:14px; }
      .filter-row { margin:-14px -14px 12px;padding-left:14px;padding-right:14px; }
      .hero-title { font-size:26px; }
      .prompt { font-size:30px; }
      .tab-bar { max-width:none;padding:6px 30px calc(5px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="avatar"><img id="avatar-img" alt="avatar"/></div>
    </div>
    <div class="header-actions">
      <button class="mini-btn primary" onclick="checkIn()">检查打卡</button>
      <button class="mini-btn" onclick="resetToday()">重置</button>
    </div>
  </header>

  <main>
    <section class="screen active" id="screen-home">
      <div class="hero">
        <div class="hero-top">
          <div>
            <div class="eyebrow">TODAY</div>
            <div class="hero-title" id="daily-proverb">Practice makes progress.</div>
            <div class="hero-quote-cn" id="daily-proverb-cn">练习带来推进</div>
          </div>
          <div class="streak"><span id="streak-num">0</span><span>days streak</span></div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="today-fill"></div></div>
        <div class="hero-meta">
          <span id="today-label">今日 0 / 180 · 90词</span>
          <span id="checkin-label">未打卡</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-value" id="known-count">0</div>
          <div class="stat-label">已掌握</div>
        </div>
        <div class="stat">

      var arr = list.slice();
      var s = seed || 1;
      for (var i = arr.length - 1; i > 0; i--) {
        s = (s * 1664525 + 1013904223) >>> 0;
        var j = s % (i + 1);
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }
    function dailyPlan() {
      var day = todayKey();
      if (!state.daily) state.daily = {};
      if (state.daily[day] && state.daily[day].words && state.daily[day].words.length >= DAILY_TARGET_PER_DECK * 3) return state.daily[day];

      var words = allWords();
      var byId = {};
      words.forEach(function(w){ byId[w.id] = w; });
      if (!state.reviewQueue) state.reviewQueue = {};

      var seed = hashDay(day);
      var picked = [];
      var pickedSet = {};
      function deckCount(deck) {
        return picked.filter(function(id){ return byId[id] && byId[id].deck === deck; }).length;
      }
      function add(id, deck) {
        if (!byId[id] || pickedSet[id]) return;
        if (deck && byId[id].deck !== deck) return;
        if (deck && deckCount(deck) >= DAILY_TARGET_PER_DECK) return;
        picked.push(id);
        pickedSet[id] = true;
      }

      ['engineering','aussie','ielts'].forEach(function(deck) {
        Object.keys(state.reviewQueue).forEach(function(id) {
          if (state.reviewQueue[id] > 0) add(id, deck);
        });
        var deckList = seededShuffle(words.filter(function(w){ return w.deck === deck; }), seed + deck.length);
        for (var i = 0; i < deckList.length && deckCount(deck) < DAILY_TARGET_PER_DECK; i++) {
          add(deckList[i].id, deck);
        }
      });

      var tasks = {};
      picked.forEach(function(id){ tasks[id] = { translation:false, listening:false }; });
      state.daily[day] = { words:picked, tasks:tasks, complete:false };

      Object.keys(state.reviewQueue).forEach(function(id) {
        state.reviewQueue[id] -= 1;
        if (state.reviewQueue[id] <= 0) delete state.reviewQueue[id];
      });
      saveState();
      return state.daily[day];
    }
    function dailyStats() {
      var plan = dailyPlan();
      var total = plan.words.length * 2;
      var done = plan.words.reduce(function(sum, id) {
        var t = plan.tasks[id] || {};
        return sum + (t.translation ? 1 : 0) + (t.listening ? 1 : 0);
      }, 0);
      return { total:total, done:done, remaining:Math.max(0,total-done), complete:total > 0 && done >= total };
    }
    function deckDailyStats(deck) {
      var plan = dailyPlan();
      var byId = {};
      allWords().forEach(function(w){ byId[w.id] = w; });
      var ids = plan.words.filter(function(id){ return byId[id] && byId[id].deck === deck; });
      var total = ids.length * 2;
      var done = ids.reduce(function(sum, id) {
        var t = plan.tasks[id] || {};
        return sum + (t.translation ? 1 : 0) + (t.listening ? 1 : 0);
      }, 0);
      return { total:total, done:done, pct:total ? Math.round(done / total * 100) : 0 };
    }

      var stats = dailyStats();
      if (stats.complete) {
        plan.complete = true;

        cnTitle:'航空航天：SpaceX 6月17日刚发射 BlueBird 8-10；下一批可关注 6月28日左右 Falcon 9 / Starlink 17-40，NASA 近期节点包括 Swift Boost（NET 6月）和 Roman Space Telescope（8月30日）。',
        url:'https://nextspaceflight.com/launches/',
        source:'Next Spaceflight · NASA · SpaceX',
        time:'Fresh radar · Jun 20'
      };
    }
    function economyRadar(day) {
      return {
        category:'ECON',
        title:'Macro radar: Fed just held rates; next watch is Fed July, RBA August, BoK July, and China July policy signals.',
        cnTitle:'经济：美联储 6月17日维持 3.5%-3.75%，下一次看 7月28-29日；澳洲 RBA 6月16日维持 4.35%，下一次重点看 8月；韩国央行 5月维持 2.50%，下一次关注 7月16日；中国重点看 7月政治局会议的稳增长/产业政策信号。',
        url:'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm',
        source:'Fed · RBA · BoK · China policy calendar',
        time:'Policy radar'
      };
    }
    function scienceRadar(day) {
      return {
        category:'SCI',
        title:'Science radar: stem-cell immune reset kept severe autoimmune disease in remission for 15 years.',
        cnTitle:'科研突破：干细胞“重置免疫系统”让严重自身免疫病长期缓解，Nature 报道两名患者接受治疗后 15 年仍无严重复发；含金量在于它不是短期症状控制，而是可能改写免疫系统本身。',
        url:'https://www.nature.com/news',
        source:'Nature',
        time:'Jun 19 · high-value breakthrough'
      };
    }
    function fetchNewsCategory(cat) {
      return Promise.all([
        fetchGoogleNews(cat.en, 'en').catch(function(){ return null; }),
        fetchGoogleNews(cat.zh, 'zh').catch(function(){ return null; })
      ]).then(function(results) {
        var en = results[0];
        var zh = results[1];
        if (zh && (isBrokenNewsText(zh.title) || isLowQualityNews(zh.title))) zh = null;
        if (!en && !zh) return null;
        return {
          category:cat.label,
          title:shortBrief(en ? en.title : 'Open today’s ' + cat.label.toLowerCase() + ' radar.'),
          cnTitle:zh ? shortBrief(zh.title) : summarizeHeadline(en ? en.title : '', cat.label),
          url:(en && en.link) || (zh && zh.link) || googleNewsSearchUrl(cat.en, 'en'),
          source:(en && en.source) || 'Google News',
          time:(en && en.pubDate) ? formatNewsTime(en.pubDate) : 'live'
        };
      });
    }
    function fallbackRadarItem(cat) {
      var fallback = {
        cs:['Open today’s CS2 match radar.', 'CS：查看今天的 CS2 赛程、队伍和赛果。'],
        worldcup:['Open today’s World Cup football radar.', '世界杯：查看今天的世界杯/预选赛相关动态。'],
        space:['Open fresh aerospace and SpaceX search results.', '航空航天：最近 7 天没抓到干净新闻，点开看 SpaceX / NASA 最新搜索。'],
        economy:['Open today’s China, Australia, US and South Korea economy radar.', '经济：查看中国、澳洲、美国、韩国今天的市场和政策动态。'],
        research:['Open today’s science research radar.', '科研：查看今天大学、论文和科学突破动态。'],
        live:['Open live breaking updates.', '实时：查看今天的突发和滚动更新。']
      }[cat.key] || ['Open today’s radar.', '查看今天的相关动态。'];
      return {
        category:cat.label,
        title:fallback[0],
        cnTitle:fallback[1],
        url:googleNewsSearchUrl(cat.en, 'en'),
        source:'Google News search',
        time:'live'
      };
    }
    function fetchGoogleNews(query, lang) {
      var rss = googleNewsRssUrl(query, lang);
      var url = 'https://api.rss2json.com/v1/api.json?rss_url=' + urlEncode(rss);
      return fetch(url).then(function(res){ return res.json(); }).then(function(data) {
        var list = data && data.items ? data.items : [];
        var item = list.map(function(entry) {
          return {
            title:cleanNewsTitle(entry.title || ''),
            link:entry.link || googleNewsSearchUrl(query, lang),
            pubDate:entry.pubDate || '',
            source:extractNewsSource(entry.title || '') || 'Google News'
          };
        }).filter(function(entry) {
          return entry.title && !isLowQualityNews(entry.title) && isFreshNews(entry.pubDate, 7);
        })[0];
        if (!item) throw new Error('empty feed');
        return item;
      });
    }
    function googleNewsRssUrl(query, lang) {
      if (lang === 'zh') return 'https://news.google.com/rss/search?q=' + urlEncode(query) + '&hl=zh-CN&gl=CN&ceid=CN:zh-Hans';
      return 'https://news.google.com/rss/search?q=' + urlEncode(query) + '&hl=en-US&gl=US&ceid=US:en';
    }
    function googleNewsSearchUrl(query, lang) {
      if (lang === 'zh') return 'https://news.google.com/search?q=' + urlEncode(query) + '&hl=zh-CN&gl=CN&ceid=CN:zh-Hans';
      return 'https://news.google.com/search?q=' + urlEncode(query) + '&hl=en-US&gl=US&ceid=US:en';
    }
    function urlEncode(str) {
      if (typeof encodeURIComponent === 'function') return encodeURIComponent(str);
      return String(str || '').replace(/[^A-Za-z0-9_.~-]/g, function(ch) {
        if (ch === ' ') return '%20';
        var hex = ch.charCodeAt(0).toString(16).toUpperCase();
        return '%' + (hex.length === 1 ? '0' + hex : hex);
      });
    }
    function cleanNewsTitle(title) {
      var text = decodeHtml(String(title || '')).replace(/\s+/g,' ').trim();
      var parts = text.split(' - ');
      if (parts.length > 1) parts.pop();
      return parts.join(' - ').trim();
    }
    function extractNewsSource(title) {
      var parts = decodeHtml(String(title || '')).split(' - ');
      return parts.length > 1 ? parts[parts.length - 1].trim() : '';
    }
    function summarizeHeadline(title, category) {
      var original = cleanNewsTitle(title || '');
      if (!original) return category + ' 今日动态：点开查看最新消息。';
      var text = original;
      var replacements = [
        [/Coming to XBOX Game Pass:?/ig,'Xbox Game Pass 即将加入'],
        [/Counter-Strike/ig,'CS'],
        [/CS2/ig,'CS2'],
        [/HLTV/ig,'HLTV'],
        [/BLAST/ig,'BLAST'],
        [/ESL/ig,'ESL'],
        [/Game Pass/ig,'Game Pass'],
        [/EA Sports FC 26/ig,'EA Sports FC 26'],
        [/RV There Yet\\?/ig,'RV There Yet?'],
        [/Winds of Arcana: Ruination/ig,'Winds of Arcana: Ruination'],
        [/NCCU Men’s Tennis Earns Berth in UTR Sports NIT Championship Field/ig,'NCCU 男子网球队获得 UTR Sports NIT 锦标赛席位'],
        [/AI-first/ig,'AI 优先'],
        [/AI-powered/ig,'AI 驱动'],
        [/artificial intelligence/ig,'人工智能'],
        [/aerospace/ig,'航空航天'],
        [/SpaceX/ig,'SpaceX'],
        [/rocket launch/ig,'火箭发射'],
        [/NASA/ig,'NASA'],
        [/FIFA World Cup 2026/ig,'2026 世界杯'],
        [/World Cup/ig,'世界杯'],
        [/qualification/ig,'预选赛'],
        [/China/ig,'中国'],
        [/Australia/ig,'澳洲'],
        [/United States/ig,'美国'],
        [/South Korea/ig,'韩国'],
        [/startup/ig,'初创公司'],
        [/raises/ig,'融资'],
        [/crores/ig,'千万卢比'],
        [/in-store music intelligence platform/ig,'门店音乐智能平台'],
        [/commercial spaces/ig,'商业空间'],
        [/sports?/ig,'体育'],
        [/football/ig,'足球'],
        [/basketball/ig,'篮球'],
        [/tennis/ig,'网球'],
        [/today/ig,'今日'],
        [/this week/ig,'本周'],
        [/economics?/ig,'经济'],
        [/markets?/ig,'市场'],
        [/politics?/ig,'政治'],
        [/election/ig,'选举'],
        [/conflict/ig,'冲突'],
        [/world/ig,'全球'],
        [/news/ig,'新闻'],
        [/technology/ig,'科技'],
        [/science/ig,'科学'],
        [/research/ig,'科研'],
        [/university/ig,'大学'],
        [/breakthrough/ig,'突破'],
        [/Open today’s/ig,'查看今天的'],
        [/What’s happening/ig,'正在发生什么'],
        [/Billion-Dollar/ig,'数十亿美元规模的'],
        [/Gaming Boom/ig,'游戏产业热潮'],
        [/Global Entertainment/ig,'全球娱乐产业']
      ];
      replacements.forEach(function(pair){ text = text.replace(pair[0], pair[1]); });
      text = repairBrokenText(text);
      if (!/[\u4e00-\u9fff]/.test(text)) {
        return categoryLabelCn(category) + '：' + original;
      }
      text = text.replace(/\\?\\?/g,'?').replace(/\\s*\\|\\s*/g,'，').replace(/\\s+/g,' ').trim();
      return shortBrief(categoryLabelCn(category) + '：' + text);
    }
    function categoryLabelCn(category) {
      return {
        CS2:'电竞',
        F1:'F1',
        CS:'CS',
        WC:'世界杯',
        SPACE:'航空航天',
        ECON:'经济',
        SCI:'科研',
        LIVE:'实时'
      }[category] || '动态';
    }
    function isLowQualityNews(title) {
      return /免费|直播|在线|入口|平台|app下载|高清|一网打尽|详解|体育在线|博彩|赔率|盘口|betting|走地|travel|tourism/i.test(String(title || ''));
    }
    function isFreshNews(value, maxDays) {
      var d = parseNewsDate(value);
      if (!d) return false;
      var now = new Date();
      var age = now.getTime() - d.getTime();
      return age >= -12 * 60 * 60 * 1000 && age <= maxDays * 24 * 60 * 60 * 1000;
    }
    function parseNewsDate(value) {
      if (!value) return null;
      var d = new Date(String(value).replace(' ', 'T') + 'Z');
      if (isNaN(d.getTime())) d = new Date(value);
      return isNaN(d.getTime()) ? null : d;
    }
    function isBrokenNewsText(title) {
      var text = String(title || '');
      return (text.match(/\?/g) || []).length > 4 || /\?.\?.\?/.test(text);
    }
    function decodeHtml(str) {
      if (!document.createElement) return str;
      var el = document.createElement('textarea');
      el.innerHTML = str;
      return el.value;
    }
    function repairBrokenText(text) {
      var value = String(text || '')
        .replace(/\?([\u4e00-\u9fff])/g,'$1')
        .replace(/([\u4e00-\u9fff])\?/g,'$1')
        .replace(/\?([A-Za-z])/g,'$1')
        .replace(/([A-Za-z])\?/g,'$1');
      if (/[\u4e00-\u9fff]/.test(value) && (value.match(/\?/g) || []).length > 0) {
        value = value.replace(/\?/g,'');
      }
      return value;
    }
    function formatNewsTime(value) {
      var d = parseNewsDate(value);
      if (!d) return String(value || '').slice(0, 16);
      return d.toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    function shortBrief(text) {
      text = String(text || '').replace(/\s+/g,' ').trim();
      if (text.length <= 190) return text;
      var cut = text.slice(0, 190);
      var space = cut.lastIndexOf(' ');
      return cut.slice(0, space > 120 ? space : 190) + '...';
    }
    function renderFilters() {
      var filters = [{key:'all',label:'全部'}].concat(Object.keys(DECKS).map(function(k){ return {key:k,label:DECKS[k].label}; }));
      document.getElementById('filter-row').innerHTML = filters.map(function(f) {
        return '<button class="chip '+(activeFilter===f.key?'active':'')+'" onclick="setFilter(&quot;'+f.key+'&quot;)">'+f.label+'</button>';
      }).join('');
    }
    function renderLibrary() {
      var list = allWords().filter(function(w){ return activeFilter === 'all' || w.deck === activeFilter; });
      document.getElementById('word-list').innerHTML = list.map(function(w) {
        var d = DECKS[w.deck];
        var ws = wordState(w.id);
        return '<div class="word-card" id="word-'+w.id+'">'
          + '<div class="word-top" onclick="toggleWord(&quot;'+w.id+'&quot;)">'
          + '<div class="word-main"><div class="word" style="color:'+d.color+'">'+escapeHtml(w.word)+'</div>'
          + '<div class="phonetic">'+escapeHtml(w.phon || '')+'</div><div class="meaning">'+escapeHtml(w.meaning)+'</div></div>'
          + '<div class="word-actions">'
          + '<button class="icon-btn" onclick="event.stopPropagation(); speakWord(&quot;'+w.id+'&quot;)">▶</button>'
          + '<button class="icon-btn '+(ws.known?'done':'')+'" onclick="event.stopPropagation(); toggleKnown(&quot;'+w.id+'&quot;)">'+(ws.known?'✓':'+' )+'</button>'
          + '</div></div>'
          + '<div class="word-body"><div class="example"><strong>Example</strong><br>'+escapeHtml(w.example)+'</div>'
          + '<div class="word-meta">'+(w.tags || []).map(function(t){ return '<span class="pill">'+escapeHtml(t)+'</span>'; }).join('')+'</div></div>'
          + '</div>';
      }).join('');
    }
    function setFilter(key) {
      activeFilter = key;
      render();
    }
    function openDeck(key) {
      activeFilter = key;
      showScreen('library');
    }
    function openWord(id) {
      var w = allWords().find(function(x){ return x.id === id; });
      if (w) activeFilter = w.deck;
      showScreen('library');
      setTimeout(function(){ toggleWord(id, true); }, 50);
    }
    function toggleWord(id, forceOpen) {
      var el = document.getElementById('word-' + id);
      if (!el) return;
      if (forceOpen) el.classList.add('open');
      else el.classList.toggle('open');
      wordState(id).seen += 1;
      saveState();
      renderHome();
    }
    function toggleKnown(id) {
      var ws = wordState(id);
      ws.known = !ws.known;
      saveState();
      render();
      toast(ws.known ? '已标记掌握：' + getWord(id).word : '已取消掌握');
    }
    function checkIn() {
      var stats = dailyStats();
      if (!stats.complete) {
        toast('还不能打卡，今天还差 ' + stats.remaining + ' 个训练项');
        showScreen('practice');
        return;
      }
      state.lastCheckIn = todayKey();
      if (!state.checkIns) state.checkIns = {};
      state.checkIns[todayKey()] = true;
      dailyPlan().complete = true;
      saveState();
      render();
      toast('今天打卡完成，宝宝稳稳推进呀');
    }
    function resetToday() {
      var day = todayKey();
      if (state.daily && state.daily[day]) delete state.daily[day];
      if (state.checkIns && state.checkIns[day]) delete state.checkIns[day];
      if (state.lastCheckIn === day) state.lastCheckIn = '';
      saveState();
      render();
      toast('今日进度已重置');
    }
    function calcStreak() {
      if (!state.checkIns) return 0;
      var count = 0;
      var d = new Date();
      for (var i=0; i<365; i++) {
        var key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        if (state.checkIns[key]) count++;
        else break;
        d.setDate(d.getDate() - 1);
      }
      return count;
    }
    function getWord(id) {
      return allWords().find(function(w){ return w.id === id; });
    }
    function setMode(next) {
      mode = next;
      practiceHistory = [];
      document.querySelectorAll('[data-mode]').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.mode === mode); });
      nextPractice(false);
    }
    function setPracticeDeck(deck) {
      practiceDeck = deck;
      practiceHistory = [];
      document.querySelectorAll('[data-practice-deck]').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.practiceDeck === practiceDeck);
      });
      nextPractice(false);
    }
    function startPractice(next, id) {
      mode = next;
      document.querySelectorAll('[data-mode]').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.mode === mode); });
      current = getWord(id);
      if (current) {
        practiceDeck = current.deck;
        practiceHistory = [];
        document.querySelectorAll('[data-practice-deck]').forEach(function(btn){
          btn.classList.toggle('active', btn.dataset.practiceDeck === practiceDeck);
        });
      }
      showScreen('practice');
      renderPracticeCard();
    }
    function pickPracticeWord() {
      var plan = dailyPlan();
      var byId = {};
      allWords().forEach(function(w){ byId[w.id] = w; });
      var dailyPool = plan.words.map(function(id){ return byId[id]; }).filter(Boolean).filter(function(w) {
        var t = plan.tasks[w.id] || {};
        if (w.deck !== practiceDeck) return false;
        if (mode === 'translation') return !t.translation;
        if (mode === 'listening') return !t.listening;
        return true;
      });
      var fallback = allWords().filter(function(w){ return w.deck === practiceDeck; });
      var pool = (dailyPool.length ? dailyPool : fallback).slice().sort(function(a,b){
        var as = wordState(a.id), bs = wordState(b.id);
        return (as.correct - as.wrong * 2) - (bs.correct - bs.wrong * 2);
      });
      var top = pool.slice(0, Math.min(14, pool.length));
      return top[Math.floor(Math.random() * top.length)] || pool[0];
    }
    function nextPractice(clear) {
      if (current && clear !== false) practiceHistory.push(current);
      current = pickPracticeWord();
      if (!current) return;
      renderPracticeCard();
      if (clear !== false) document.getElementById('answer-box').focus();
    }
    function previousPractice() {
      if (!practiceHistory.length) {
        toast('还没有上一题');
        return;
      }
      current = practiceHistory.pop();
      renderPracticeCard();
      document.getElementById('answer-box').focus();
    }
    function renderPracticeCard() {
      if (!current) return;
      var kind = document.getElementById('practice-kind');
      var prompt = document.getElementById('practice-prompt');
      var sub = document.getElementById('practice-sub');
      var input = document.getElementById('answer-box');
      var feedback = document.getElementById('feedback');
      var answer = document.getElementById('card-answer');
      var hint = document.getElementById('tap-hint');
      var answerPanel = document.getElementById('answer-panel');
      var checkBtn = document.getElementById('check-btn');
      currentCardRevealed = false;
      input.value = '';
      feedback.className = 'feedback';
      feedback.textContent = '';
      answer.className = 'card-answer';
      answer.innerHTML = '<strong>' + escapeHtml(current.meaning) + '</strong><div class="card-example">' + escapeHtml(current.example) + '</div>';
      hint.style.display = 'block';
      checkBtn.style.display = '';
      if (mode === 'translation') {
        kind.textContent = deckLabel(current.deck) + ' · 中文默写';
        prompt.textContent = current.cn || current.meaning;
        sub.textContent = '看中文翻译，默写英文；完成一次算入今日打卡';
        input.placeholder = 'type the English word';
        answerPanel.style.display = 'block';
      } else {
        kind.textContent = deckLabel(current.deck) + ' · 听写';
        prompt.textContent = '听音默写';
        sub.textContent = '点发音，然后默写英文；完成一次算入今日打卡';
        input.placeholder = 'type what you heard';
        answerPanel.style.display = 'block';
        setTimeout(speakCurrent, 250);
      }
    }
    function deckLabel(deck) {
      return DECKS[deck] ? DECKS[deck].label : deck;
    }
    function flipCurrentCard() {
      if (!current) return;
      var answer = document.getElementById('card-answer');
      var hint = document.getElementById('tap-hint');
      currentCardRevealed = !currentCardRevealed;
      answer.classList.toggle('show', currentCardRevealed);
      hint.style.display = currentCardRevealed ? 'none' : 'block';
    }
    function checkAnswer() {
      if (!current) nextPractice(false);
      var ans = document.getElementById('answer-box').value.trim().toLowerCase();
      var ws = wordState(current.id);
      var ok = false;
      ok = normalize(ans) === normalize(current.word);
      ws.seen += 1;
      var feedback = document.getElementById('feedback');
      if (ok) {
        ws.correct += 1;
        if (mode === 'translation' || mode === 'listening') markDailyTask(current.id, mode);
        if (ws.correct >= 3) ws.known = true;
        flipAnswerOpen();
        feedback.className = 'feedback show good';
        feedback.innerHTML = '对啦。<strong>' + escapeHtml(current.word) + '</strong> = ' + escapeHtml(current.meaning);
      } else {
        ws.wrong += 1;
        if (mode === 'translation' || mode === 'listening') {
          markDailyTask(current.id, mode);
          queueReview(current.id);
        }
        flipAnswerOpen();
        feedback.className = 'feedback show bad';
        feedback.innerHTML = '差一点，今日进度已记录，已放进明后天复现池。答案是 <strong>' + escapeHtml(current.word) + '</strong><br>' + escapeHtml(current.meaning);
      }
      saveState();
      renderHome();
      updatePracticeBadges();
    }
    function revealAnswer() {
      if (!current) return;
      flipAnswerOpen();
      var feedback = document.getElementById('feedback');
      feedback.className = 'feedback show';
      feedback.innerHTML = '<strong>' + escapeHtml(current.word) + '</strong><br>' + escapeHtml(current.meaning) + '<br><span style="color:var(--muted)">' + escapeHtml(current.example) + '</span>';
      wordState(current.id).seen += 1;
      saveState();
      renderHome();
    }
    function flipAnswerOpen() {
      currentCardRevealed = false;
      flipCurrentCard();
    }
    function speakCurrent() {
      if (current) speak(current.word);
    }
    function speakWord(id) {
      var w = getWord(id);
      if (w) speak(w.word);
    }
    function speak(text) {
      if (!window.speechSynthesis) {
        toast('这个浏览器不支持发音');
        return;
      }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-AU';
      u.rate = .86;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
    function updatePracticeBadges() {
      var stats = dailyStats();
      document.getElementById('practice-badge').textContent = stats.remaining;
      document.getElementById('home-badge').textContent = stats.remaining;
    }
    function normalize(str) {
      return String(str || '').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    }
    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g,function(ch){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
      });
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/`/g,'&#96;');
    }
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
    }
    document.getElementById('answer-box').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkAnswer();
    });
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) refreshWorldBriefIfStale(radarKey());
    });
    hydrateAvatar();
    render();
    nextPractice(false);
  </script>
</body>
</html>
