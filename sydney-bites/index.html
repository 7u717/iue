    function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function km(a,b,c,d){const R=6371,toRad=n=>n*Math.PI/180;const x=toRad(c-a),y=toRad(d-b);const h=Math.sin(x/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
    function distance(p){return currentPos?km(currentPos.lat,currentPos.lng,p.lat,p.lng):Infinity}
    const dishZh={
      'dim sum':'点心','roast duck':'烧鸭','dry-aged fish':'熟成鱼','sea urchin crumpet':'海胆松饼','tasting menu':'品鉴菜单','seasonal set menu':'季节套餐','set menu':'套餐','local produce':'本地食材','seasonal plates':'季节小盘','potato bread':'土豆面包','roasted oysters':'烤生蚝','wood-fired seafood':'柴火烤海鲜','steak':'牛排','char kway teow':'炒粿条','salted egg chicken':'咸蛋黄鸡','vodka pasta':'伏特加意面','tiramisu':'提拉米苏','hoppers':'斯里兰卡薄饼','sambols':'椰香辣酱','curry':'咖喱','roti canai':'印度煎饼','satay':'沙爹','boat noodles':'船面','mango sticky rice':'芒果糯米饭','tonkotsu ramen':'豚骨拉面','pork roll':'越南猪肉卷','clam pizza':'蛤蜊披萨','pepperoni':'辣香肠披萨','pastries':'酥皮点心','sausage roll':'香肠卷','grilled dishes':'炭烤料理','snacks':'小食','seafood':'海鲜','pasta':'意面','cocktails':'鸡尾酒','chicken fricassee':'奶油炖鸡','oysters':'生蚝','wood-fired flatbread':'柴火烤扁面包','burrata':'布拉塔奶酪','anchovy toast':'鳀鱼吐司','flatbread':'扁面包','lamingtons':'拉明顿蛋糕','coffee':'咖啡','fried chicken':'炸鸡','croissant pie':'可颂派','tart':'挞','onigiri':'饭团','curry rice':'咖喱饭','pho dac biet':'特别牛肉粉','crispy skin chicken rice':'脆皮鸡饭','canh chua':'越南酸汤','bo la lot':'槟榔叶牛肉卷','jollof rice':'西非炒饭','suya':'烤肉串','watermelon cake':'西瓜蛋糕','pho':'越南河粉','banh mi':'越南法棍','souffle pancake':'舒芙蕾松饼','matcha':'抹茶','sushi':'寿司','ramen':'拉面','katsu curry':'炸猪排咖喱','gyoza':'煎饺','hot pot':'火锅','dumplings':'饺子','xiao long bao':'小笼包','mezze':'中东小拼盘','meze':'中东小拼盘','lamb shoulder':'慢烤羊肩','warm lebanese table food':'热乎的黎巴嫩家常桌菜'
    };
    const cuisineZh={
      'Seafood':'海鲜','Modern Australian':'现代澳洲菜','Fire cooking':'柴火料理','Malaysian':'马来西亚菜','Thai':'泰国菜','Japanese':'日料','Ramen':'拉面','Korean':'韩餐','Vietnamese':'越南菜','Chinese':'中餐','Cantonese':'粤菜','Cantonese BBQ':'粤式烧腊','Chinese Noodles':'中式面食','Dumplings':'饺子','Hot Pot':'火锅','Hotpot':'火锅','Taiwanese':'台湾菜','Italian':'意大利菜','Pizza':'披萨','Cafe':'咖啡早午餐','Bakery':'烘焙甜点','Dessert':'甜品','Gelato':'冰淇淋','Matcha':'抹茶甜品','Brunch':'早午餐','Middle Eastern':'中东菜','Lebanese':'黎巴嫩菜','Egyptian':'埃及菜','Turkish':'土耳其菜','Sri Lankan':'斯里兰卡菜','French':'法餐','Greek':'希腊菜','Asian Bakery':'亚洲烘焙','Japanese Bar':'日式小酒馆','Indian Street Food':'印度街头小吃','Bar Food':'酒吧小食','Rooftop':'屋顶餐厅','Deli':'熟食小馆','Burgers':'汉堡'
    };
    function dishChinese(text=''){return text.split(',').map(part=>{const key=part.trim().toLowerCase();return dishZh[key]||''}).filter(Boolean).join('、')}
    function dishLine(p){const zh=dishChinese(p.dish);return `✦ ${esc(p.dish)}${zh?`<span class="dish-zh">${esc(zh)}</span>`:''}`}
    function cuisineChinese(text=''){return cuisineZh[text]||'餐厅'}
    function noteChinese(p){
      const s=`${p.note||''} ${p.cuisine||''}`.toLowerCase();
      if(/special|luxe|polished|date|visitor/.test(s))return '适合想吃得正式一点、慢慢坐下来的一餐。';
      if(/group|sharing|share|table|hotpot/.test(s))return '适合和朋友一起点几道菜分着吃。';
      if(/comfort|cheap|fast|student|quick|casual/.test(s))return '适合想轻松解决一顿、但又不想随便吃的时候。';
      if(/sweet|bakery|treat|dessert|matcha|gelato/.test(s))return '适合下午想吃甜点或者顺路奖励自己。';
      if(/ramen|noodle|pho|bowl/.test(s))return '适合想吃一碗热的、舒服一点的主食。';
      return '适合先收藏起来，想换口味的时候去打卡。';
    }
    function visible(){const q=$('search').value.trim().toLowerCase();let out=places.filter(p=>(mode==='done'?p.visited:!p.visited)&&[p.name,p.area,p.cuisine,p.dish,p.address].join(' ').toLowerCase().includes(q));if(filter==='__nearby')out=out.filter(p=>distance(p)<=5).sort((a,b)=>distance(a)-distance(b));else if(filter!=='All')out=out.filter(p=>p.cuisine===filter);return mode==='done'?out.sort((a,b)=>(b.rating||0)-(a.rating||0)||distance(a)-distance(b)||a.name.localeCompare(b.name)):out}
    function renderFilters(){const cuisines=['All','__nearby',...new Set(places.map(p=>p.cuisine))];$('filters').innerHTML=cuisines.map(c=>`<button class="chip ${filter===c?'active':''}" data-c="${esc(c)}">${c==='__nearby'?'附近想吃':esc(c)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.c;if(filter==='__nearby')locateUser(false);render()})}
    function imageFor(p){return p.photo||p.imageUrl||''}
    function tileStyle(p){const n=[...p.id].reduce((s,ch)=>s+ch.charCodeAt(0),0);const hues=[205,218,236,262,184,28,345];const h=hues[n%hues.length];return `--tile-a:hsla(${h},70%,62%,.34);--tile-b:hsla(${(h+42)%360},58%,58%,.22)`}
    function photoHTML(p){const src=imageFor(p);return src?`<img loading="lazy" src="${esc(src)}" alt="${esc(p.name)}">`:`<div class="fallback-tile" style="${tileStyle(p)}"><b>${esc(p.emoji||'🍽️')}</b></div>`}
    function render(){renderFilters();const items=visible();$('sectionLabel').textContent=mode==='done'?'EATEN · BY RATING':'WANT TO TRY';const sub=$('subtitle');if(sub)sub.textContent='';$('modeToggle').textContent=mode==='done'?'‹':'★';$('count').textContent=`${items.length} places`;$('list').innerHTML=items.length?items.map(p=>`<article class="card" data-id="${p.id}"><div class="thumb">${photoHTML(p)}</div><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.area)} · ${esc(p.address)}</div><div class="dish">${dishLine(p)}</div><div class="tags"><span class="tag">${esc(p.cuisine)}</span><span class="tag">${filter==='__nearby'&&currentPos?distance(p).toFixed(1)+' km':p.visited?`★ ${p.rating||0}`:'want'}</span>${mode==='done'?`<button class="mini-delete" data-del="${p.id}">Remove</button>`:''}</div></div></article>`).join(''):'<div class="empty">这里暂时空着呀，换个筛选试试看。</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openPlace(c.dataset.id));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();removePlace(b.dataset.del)});refreshMap()}
    function explain(p){const dishZhText=dishChinese(p.dish)||'招牌推荐菜';const english=`${p.name} is a ${p.cuisine} place in ${p.area}. Try ${p.dish}. ${p.note}.`;const chinese=`这是一家位于 ${p.area} 的${cuisineChinese(p.cuisine)}。推荐点${dishZhText}。${noteChinese(p)}`;return `<b>中文</b>${esc(chinese)}<br><br><b>English</b>${esc(english)}`}
    function renderStars(){if(!selected)return;$('dStars').innerHTML=[1,2,3,4,5].map(n=>`<button class="star ${n<=selected.rating?'on':''}" data-star="${n}">★</button>`).join('');document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{selected.rating=+b.dataset.star;selected.visited=true;save();renderStars();render()})}
    function openPlace(id){selected=places.find(p=>p.id===id);if(!selected)return;$('dPhoto').innerHTML=photoHTML(selected);$('dName').textContent=selected.name;$('dMeta').textContent=`${selected.area} · ${selected.cuisine}${currentPos?' · '+distance(selected).toFixed(1)+' km':''}`;$('dDish').innerHTML=dishLine(selected);$('dNote').innerHTML=explain(selected);$('dTags').innerHTML=`<span class="tag">${selected.source}</span><span class="tag">${selected.visited?'eaten':'want to try'}</span>`;$('dMap').href=`https://maps.apple.com/?q=${encodeURIComponent(selected.name+' '+selected.address)}&ll=${selected.lat},${selected.lng}`;$('dUpload').style.display='block';renderStars();detail.showModal()}
    function removePlace(id){places=places.filter(p=>p.id!==id);if(selected&&selected.id===id){selected=null;detail.close()}save();render()}
    detail.addEventListener('click',e=>{if(e.target===detail)detail.close()});
    function readPhoto(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
    $('photoInput').onchange=e=>{const file=e.target.files[0];if(!file||!selected)return;readPhoto(file,src=>{selected.photo=src;selected.visited=true;if(!selected.rating)selected.rating=4;save();detail.close();mode='done';setPage('home');render()})};
    function setupMap(){if(map)return;map=L.map('map',{zoomControl:false}).setView([-33.875,151.21],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);locateUser(false)}
    function locateUser(fillForm=true){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(pos=>{currentPos={lat:pos.coords.latitude,lng:pos.coords.longitude};if(map){const icon=L.divIcon({html:'<div class="my-pin"></div>',className:'',iconSize:[20,20],iconAnchor:[10,10]});if(myMarker)myMarker.remove();myMarker=L.marker([currentPos.lat,currentPos.lng],{icon}).addTo(map);map.setView([currentPos.lat,currentPos.lng],15)}if(fillForm){const f=$('placeForm');f.lat.value=currentPos.lat.toFixed(6);f.lng.value=currentPos.lng.toFixed(6);if(!f.address.value)f.address.value='Current location'}if(filter==='__nearby')render()},()=>{}, {enableHighAccuracy:true,timeout:7000})}
    function refreshMap(){if(!map)return;markers.forEach(m=>m.remove());markers=[];places.forEach(p=>{const html=p.visited&&p.photo?`<div class="pin eaten"><img src="${p.photo}"></div>`:`<div class="pin">${p.emoji}</div>`;const icon=L.divIcon({html,className:'',iconSize:p.visited&&p.photo?[58,56]:[34,34],iconAnchor:p.visited&&p.photo?[29,56]:[17,17]});const m=L.marker([p.lat,p.lng],{icon}).addTo(map).on('click',()=>openPlace(p.id));markers.push(m)})}
    function setPage(page){document.querySelectorAll('main').forEach(m=>m.classList.toggle('active',m.id===page));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='mapPage'){setupMap();setTimeout(()=>{map.invalidateSize();refreshMap()},70)}}
    function showPendingPhoto(){const box=$('newPhotoPreview');box.innerHTML=pendingPhoto?`<img src="${pendingPhoto}">`:'';box.classList.toggle('show',!!pendingPhoto)}
    function launchCamera(){pendingPhoto='';$('quickCamera').value='';$('quickCamera').click()}
    document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(b.dataset.page==='addPage')launchCamera();else setPage(b.dataset.page)});$('search').oninput=render;$('modeToggle').onclick=()=>{mode=mode==='done'?'want':'done';filter='All';setPage('home');render()};
    $('quickCamera').onchange=e=>{const file=e.target.files[0];if(!file)return;readPhoto(file,src=>{pendingPhoto=src;setPage('addPage');showPendingPhoto();locateUser(true)})};
    $('useLocation').onclick=()=>locateUser(true);$('locateMap').onclick=()=>locateUser(false);
    $('dRemove').onclick=()=>selected&&removePlace(selected.id);
    $('placeForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),name=d.get('name');const hadPhoto=!!pendingPhoto;places.unshift({id:Date.now().toString(),name,area:d.get('area'),cuisine:d.get('cuisine'),dish:d.get('dish'),address:d.get('address'),lat:+d.get('lat')||currentPos?.lat||-33.875,lng:+d.get('lng')||currentPos?.lng||151.21,emoji:'🍽️',note:d.get('note')||'custom saved place; add a photo after visiting.',source:'custom',visited:hadPhoto,photo:pendingPhoto,rating:hadPhoto?4:0});save();pendingPhoto='';showPendingPhoto();e.target.reset();mode=hadPhoto?'done':'want';setPage('home');render()};
    function checkFreshBuild(){
      try{
        localStorage.setItem('crave_app_version',APP_VERSION);
        fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})
          .then(r=>r.text())
          .then(html=>{
            const match=html.match(/const APP_VERSION='([^']+)'/);
            if(match&&match[1]!==APP_VERSION)location.reload();
          })
          .catch(()=>{});
      }catch{}
    }
    render();
    setTimeout(checkFreshBuild,1200);
  </script>
</body>
</html>
