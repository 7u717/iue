<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2e9" />
  <title>Sydney Bites · 悉尼吃什么</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    :root{--ink:#1e2d25;--muted:#718078;--paper:#f7f4ed;--cream:#fffdf9;--line:#e7e1d5;--coral:#ed7656;--coral-d:#c9563c;--sage:#dce7d8;--sun:#f5c96d;--shadow:0 12px 32px rgba(30,45,37,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans","Noto Sans SC",system-ui,sans-serif}.shell{max-width:720px;margin:auto;min-height:100vh;background:var(--cream);padding:0 20px 100px}
    header{padding:28px 4px 18px;display:flex;align-items:flex-start;justify-content:space-between}.eyebrow{color:var(--coral-d);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.brand{font:600 35px/1 "Playfair Display","Noto Sans SC",serif;letter-spacing:-.04em;margin:5px 0 3px}.tagline{color:var(--muted);font-size:14px;margin:0}.add{border:0;border-radius:50%;background:var(--ink);color:white;width:46px;height:46px;font-size:27px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
    .hero{background:var(--sage);border-radius:25px;padding:20px;margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:"✦";font:100px Georgia;color:#b1c7aa;position:absolute;right:10px;bottom:-38px}.hero h2{font:600 23px/1.25 "Playfair Display","Noto Sans SC",serif;margin:0 0 8px;max-width:360px}.hero p{margin:0;color:#526458;font-size:14px;max-width:350px}.search{margin-top:16px;display:flex;align-items:center;gap:9px;background:#fffdf9;border:1px solid rgba(30,45,37,.08);border-radius:14px;padding:12px 14px;position:relative}.search input{border:0;outline:0;background:transparent;width:100%;font:14px inherit;color:var(--ink)}
    .tabs{display:flex;gap:8px;margin:12px 0 20px}.tab{border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:999px;padding:9px 15px;font:600 13px inherit;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.count{opacity:.65;margin-left:3px}
    .section-title{font:600 15px "Noto Sans SC",sans-serif;margin:2px 0 10px;color:var(--ink)}.list{display:grid;gap:11px}.card{display:flex;gap:14px;text-decoration:none;color:inherit;padding:13px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 10px rgba(30,45,37,.025);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.photo{width:76px;height:76px;border-radius:14px;flex:none;display:grid;place-items:center;background:#f8e4da;font-size:29px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.card-info{min-width:0;flex:1}.name-line{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font:700 17px "DM Sans","Noto Sans SC",sans-serif}.pill{color:var(--coral-d);background:#fff0ea;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap}.meta{color:var(--muted);font-size:12px;margin:2px 0 7px}.dish{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:50px 25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
    dialog{border:0;border-radius:25px;padding:0;width:min(560px,calc(100% - 30px));box-shadow:0 20px 80px rgba(0,0,0,.25);background:var(--cream)}dialog::backdrop{background:rgba(30,45,37,.42);backdrop-filter:blur(2px)}.modal-head{padding:22px 22px 12px;display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font:600 25px "Playfair Display","Noto Sans SC",serif}.close{border:0;background:#eee9de;border-radius:50%;width:32px;height:32px;font-size:20px;cursor:pointer}.modal-content{padding:8px 22px 24px}.detail-image{width:100%;height:180px;border-radius:18px;background:var(--sage);display:grid;place-items:center;font-size:60px;overflow:hidden;margin-bottom:18px}.detail-image img{height:100%;width:100%;object-fit:cover}.recommend{color:var(--coral-d);font-weight:700;margin:5px 0 12px}.note{color:var(--muted);font-size:14px;line-height:1.7}.map{display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--ink);color:#fff;border-radius:14px;padding:13px;margin-top:18px;font-weight:700;font-size:14px}.upload{display:block;background:#fff0ea;color:var(--coral-d);border:1px dashed #e5a692;border-radius:14px;padding:13px;text-align:center;font-weight:700;font-size:14px;margin-top:10px;cursor:pointer}.upload input{display:none}
    form{display:grid;gap:11px}label{font-size:12px;font-weight:700;color:var(--muted)}input,textarea,select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font:14px inherit;color:var(--ink);outline-color:var(--coral)}textarea{resize:vertical;min-height:64px}.save{border:0;background:var(--coral);color:#fff;padding:13px;border-radius:13px;font:700 14px inherit;cursor:pointer;margin-top:3px}.small{font-size:12px;color:var(--muted);margin-top:10px}.hidden{display:none}
    @media(max-width:450px){.shell{padding-left:15px;padding-right:15px}.brand{font-size:32px}header{padding-top:22px}.hero{border-radius:22px}.card{padding:11px}.photo{width:68px;height:68px}}
  </style>
</head>
<body><main class="shell">
  <header><div><div class="eyebrow">Sydney food diary</div><h1 class="brand">Sydney Bites</h1><p class="tagline">宝宝的悉尼美食地图 · 慢慢吃遍这座城</p></div><button class="add" id="addBtn" aria-label="新增餐厅">+</button></header>
  <section class="hero"><h2>今天想吃点什么呀？</h2><p>从深夜泰餐到海边意面，把每一次好好吃饭都收藏起来。</p><div class="search">⌕ <input id="search" placeholder="搜店名、区域、菜系…" /></div></section>
  <nav class="tabs"><button class="tab active" data-tab="want">想吃 <span class="count" id="wantCount"></span></button><button class="tab" data-tab="done">吃过 <span class="count" id="doneCount"></span></button></nav>
  <div class="section-title" id="sectionTitle">这份清单值得慢慢吃</div><section class="list" id="list"></section>
</main>
<dialog id="detailModal"><div class="modal-head"><h3 id="detailName"></h3><button class="close" onclick="detailModal.close()">×</button></div><div class="modal-content"><div class="detail-image" id="detailImage">🍽️</div><div class="meta" id="detailMeta"></div><div class="recommend" id="detailDish"></div><p class="note" id="detailNote"></p><a id="mapLink" class="map" target="_blank">在 Apple Maps 打开地址 ↗</a><label class="upload" id="photoLabel">上传这次吃的照片，标记为吃过<input id="photoInput" type="file" accept="image/*"></label><p class="small" id="source"></p></div></dialog>
<dialog id="addModal"><div class="modal-head"><h3>收藏一家店</h3><button class="close" onclick="addModal.close()">×</button></div><div class="modal-content"><form id="addForm"><label>店名<input name="name" required></label><label>区域<input name="suburb" required placeholder="例如 Haymarket"></label><label>菜系<input name="cuisine" required placeholder="例如 泰国"></label><label>推荐菜<input name="dish" required></label><label>地址<input name="address" required></label><label>小备注<textarea name="note" placeholder="为什么想吃它？"></textarea></label><label>状态<select name="visited"><option value="false">还没吃，放进想吃清单</option><option value="true">已经吃过啦</option></select></label><button class="save">保存到美食地图</button></form></div></dialog>
<script>
const seed=[
 ['Ho Jiak','Haymarket','马来西亚','炒粿条 / 咸蛋黄鸡翅','92 Hay St, Haymarket NSW 2000','槟城风味，适合带朋友一起点很多盘呀。','🍜','Broadsheet 精选'],
 ['Chat Thai','Haymarket','泰国','船面 / 芒果糯米饭','20 Campbell St, Haymarket NSW 2000','想吃泰餐时的安全牌，深夜也很合适。','🥭','Broadsheet / Time Out'],
 ['Firedoor','Surry Hills','柴火料理','当日柴火海鲜 / 牛排','23-33 Mary St, Surry Hills NSW 2010','坐吧台看火焰和厨师忙碌，会是很特别的一晚。','🔥','Broadsheet 精选'],
 ['Ester','Chippendale','现代澳洲','发酵土豆面包','46-52 Meagher St, Chippendale NSW 2008','低调但很有水准，庆祝小日子首选。','🥖','Broadsheet 精选'],
 ['Pellegrino 2000','Surry Hills','意大利','奶油伏特加意面','80 Campbell St, Surry Hills NSW 2010','氛围特别热闹，提前订位比较稳。','🍝','社媒热门'],
 ['Lankan Filling Station','Darlinghurst','斯里兰卡','Hoppers / 咖喱套餐','58 Riley St, Darlinghurst NSW 2010','薄脆 Hopper 配浓郁咖喱，值得专程去。','🥥','本地指南'],
 ['Cibaria','Manly','意大利','手工意面 / Gelato','55 North Steyne, Manly NSW 2095','海边散步后去吃，周末感拉满。','🌊','Time Out 2026 提名'],
 ['Tan Viet','Cabramatta','越南','脆皮鸡配番茄饭','100 John St, Cabramatta NSW 2166','西区宝藏，脆皮鸡是绝对主角。','🍗','社媒热门']
].map((x,i)=>({id:'seed'+i,name:x[0],suburb:x[1],cuisine:x[2],dish:x[3],address:x[4],note:x[5],emoji:x[6],source:x[7],visited:false,photo:null}));
let places=JSON.parse(localStorage.getItem('sydney-bites-v1')||'null')||seed, active='want', selected=null;
const $=s=>document.querySelector(s), list=$('#list');
function save(){localStorage.setItem('sydney-bites-v1',JSON.stringify(places))}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){let q=$('#search').value.trim().toLowerCase();let items=places.filter(p=>p.visited===(active==='done')&&[p.name,p.suburb,p.cuisine,p.dish].join(' ').toLowerCase().includes(q));$('#wantCount').textContent=places.filter(p=>!p.visited).length;$('#doneCount').textContent=places.filter(p=>p.visited).length;$('#sectionTitle').textContent=active==='want'?'这份清单值得慢慢吃':'宝宝已经好好吃过啦';list.innerHTML=items.length?items.map(p=>`<article class="card" data-id="${p.id}"><div class="photo">${p.photo?`<img src="${p.photo}">`:p.emoji}</div><div class="card-info"><div class="name-line"><div class="name">${esc(p.name)}</div><span class="pill">${esc(p.cuisine)}</span></div><div class="meta">${esc(p.suburb)} · ${esc(p.address.split(',')[0])}</div><div class="dish">✦ ${esc(p.dish)}</div></div></article>`).join(''):'<div class="empty">这里还空着呢～<br>去发现下一家值得吃的店吧。</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
function openDetail(id){selected=places.find(p=>p.id===id);$('#detailName').textContent=selected.name;$('#detailMeta').textContent=`${selected.suburb} · ${selected.cuisine}`;$('#detailDish').textContent=`✦ 推荐：${selected.dish}`;$('#detailNote').textContent=selected.note;$('#source').textContent=`灵感来源：${selected.source}`;$('#detailImage').innerHTML=selected.photo?`<img src="${selected.photo}">`:selected.emoji;$('#mapLink').href='https://maps.apple.com/?q='+encodeURIComponent(selected.address);$('#photoLabel').classList.toggle('hidden',selected.visited);detailModal.showModal()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{active=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()});$('#search').oninput=render;$('#addBtn').onclick=()=>addModal.showModal();
$('#photoInput').onchange=e=>{let file=e.target.files[0];if(!file||!selected)return;let r=new FileReader();r.onload=()=>{selected.photo=r.result;selected.visited=true;save();detailModal.close();active='done';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='done'));render()};r.readAsDataURL(file)};
$('#addForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);places.unshift({id:Date.now().toString(),name:d.get('name'),suburb:d.get('suburb'),cuisine:d.get('cuisine'),dish:d.get('dish'),address:d.get('address'),note:d.get('note')||'等宝宝来留下这次的味道。',emoji:'🍽️',source:'宝宝亲自收藏',visited:d.get('visited')==='true',photo:null});save();e.target.reset();addModal.close();render()};render();
</script></body></html>
