<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PULSE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none}
body{background:#000;color:#e7e9ea;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;min-height:100vh}
#hdr{position:sticky;top:0;z-index:99;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);border-bottom:1px solid #2f3336}
#hdr-inner{max-width:600px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#logo{font-size:20px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px}
#logo-dot{width:8px;height:8px;border-radius:50%;background:#ff3b30;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#ts{font-size:12px;color:#536471}
#rbtn{background:#e7e9ea;color:#000;border:none;border-radius:9999px;padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
#rbtn:disabled{opacity:.45;cursor:not-allowed}
#tabs{max-width:600px;margin:0 auto;display:flex;overflow-x:auto;border-bottom:1px solid #2f3336}
#tabs::-webkit-scrollbar{display:none}
.tb{flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;color:#536471;padding:13px 16px;font-size:15px;font-weight:400;cursor:pointer;font-family:inherit;white-space:nowrap;transition:color .15s}
.tb.on{color:#e7e9ea;font-weight:700;border-bottom-color:#1d9bf0}
.tb-n{font-size:11px;background:#1a1a1a;border-radius:9999px;padding:1px 6px;margin-left:3px;color:#536471}
.tb.on .tb-n{background:#e7e9ea;color:#000}
#feed{max-width:600px;margin:0 auto}
#wel{padding:72px 20px;text-align:center}
#wel .ico{font-size:48px;margin-bottom:20px}
#wel h2{font-size:24px;font-weight:800;margin-bottom:10px;letter-spacing:-.3px}
#wel p{color:#536471;font-size:15px;line-height:1.7;margin-bottom:28px}
#sbtn{background:#e7e9ea;color:#000;border:none;border-radius:9999px;padding:13px 32px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.sk-item{padding:16px;border-bottom:1px solid #2f3336}
.sk{background:#111;border-radius:4px;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.25}50%{opacity:.55}}
.card{padding:16px;border-bottom:1px solid #2f3336;transition:background .12s}
.card:hover{background:#080808}
.card.brk{border-left:2px solid #ff3b30}
.card.urg{border-left:2px solid #ff9f0a}
.c-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:9999px}
.pdot{width:5px;height:5px;border-radius:50%}
.reg{font-size:13px;color:#536471}
.tstamp{font-size:13px;color:#536471;margin-left:auto}
.hl{font-size:16px;font-weight:700;line-height:1.45;margin-bottom:6px;letter-spacing:-.1px}
.sm{font-size:14px;color:#71767b;line-height:1.65;margin-bottom:10px}
.c-bot{display:flex;align-items:center;justify-content:space-between}
.src{font-size:13px;color:#333}
.imp{display:flex;gap:3px}
.ibar{width:14px;height:3px;border-radius:2px;background:#1f1f1f}
.ibar.lit{background:#536471}
.ibar.hi{background:#e7e9ea}
.div{padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#536471;border-bottom:1px solid #2f3336;background:#000}
#err{padding:60px 20px;text-align:center;display:none}
#err .eico{font-size:36px;margin-bottom:14px}
#err h3{font-weight:700;margin-bottom:8px}
#emsg{color:#536471;font-size:12px;font-family:monospace;word-break:break-all;max-width:420px;margin:0 auto 20px;line-height:1.6}
#rtbtn{background:none;color:#e7e9ea;border:1px solid #2f3336;border-radius:9999px;padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.empty{padding:48px 20px;text-align:center;color:#536471;font-size:15px}
</style>
</head>
<body>
<div id="hdr">
  <div id="hdr-inner">
    <div id="logo"><div id="logo-dot"></div>PULSE</div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="ts"></span>
      <button id="rbtn" onclick="load()">获取快讯</button>
    </div>
  </div>
  <div id="tabs"></div>
</div>
<div id="feed">
  <div id="wel">
    <div class="ico">🌐</div>
    <h2>全球实时快讯</h2>
    <p>AI 搜索全球最新动态<br>突发 · 经济 · 政治 · 航天 · 娱乐 · 体育 · 游戏</p>
    <button id="sbtn" onclick="load()">获取最新资讯</button>
  </div>
  <div id="err">
    <div class="eico">⚠️</div>
    <h3>加载失败</h3>
    <div id="emsg"></div>
    <button id="rtbtn" onclick="load()">重新加载</button>
  </div>
  <div id="sk" style="display:none"></div>
  <div id="nl"></div>
  <div style="height:48px"></div>
</div>
<script>
const CATS=[
  {id:'all',label:'推荐',color:'#e7e9ea'},
  {id:'brk',label:'⚡ 突发',color:'#ff3b30'},
  {id:'urg',label:'🔴 紧急',color:'#ff9f0a'},
  {id:'eco',label:'经济',color:'#1d9bf0'},
  {id:'pol',label:'政治',color:'#ff6b35'},
  {id:'space',label:'🚀 航天',color:'#bf5af2'},
  {id:'ent',label:'娱乐',color:'#ff375f'},
  {id:'sport',label:'体育',color:'#30d158'},
  {id:'game',label:'🎮 游戏',color:'#ffd60a'},
];
const CM={};CATS.forEach(c=>CM[c.id]=c);
let news=[],tab='all';

function tabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>{
    const n=c.id==='all'?news.length:news.filter(x=>x.c===c.id).length;
    return`<button class="tb ${tab===c.id?'on':''}" onclick="sw('${c.id}')">${c.label}${news.length&&n?`<span class="tb-n">${n}</span>`:''}</button>`;
  }).join('');
}

function sw(id){tab=id;tabs();render()}

function impBar(n){
  n=Math.min(5,Math.max(1,parseInt(n)||3));
  return Array(5).fill(0).map((_,i)=>`<div class="ibar ${i<n?(n>=4?'hi':'lit'):''}"></div>`).join('');
}

function card(item){
  const c=CM[item.c]||{color:'#536471',label:item.c};
  const lbl=c.label.replace(/[⚡🔴🚀🎮]\s*/g,'').trim();
  const bc=item.c==='brk'?'brk':item.c==='urg'?'urg':'';
  return`<div class="card ${bc}">
    <div class="c-top">
      <div class="pill" style="background:${c.color}22;color:${c.color}"><div class="pdot" style="background:${c.color}"></div>${lbl}</div>
      <span class="reg">${item.r||''}</span>
      <span class="tstamp">${item.t||''}</span>
    </div>
    <div class="hl">${item.h||''}</div>
    <div class="sm">${item.s||''}</div>
    <div class="c-bot"><span class="src">${item.src||''}</span><div class="imp">${impBar(item.i)}</div></div>
  </div>`;
}

function render(){
  const nl=document.getElementById('nl');
  let d=tab==='all'?[...news]:news.filter(x=>x.c===tab);
  if(!d.length){nl.innerHTML='<div class="empty">该分类暂无内容</div>';return}
  d.sort((a,b)=>{const p={brk:0,urg:1};const pa=p[a.c]??2,pb=p[b.c]??2;return pa!==pb?pa-pb:(b.i||3)-(a.i||3)});
  let html='';
  if(tab==='all'){
    const brks=d.filter(x=>x.c==='brk'),rest=d.filter(x=>x.c!=='brk');
    if(brks.length){html+=`<div class="div">⚡ 突发新闻</div>`;brks.forEach(x=>html+=card(x))}
    if(rest.length){html+=`<div class="div">最新动态</div>`;rest.forEach(x=>html+=card(x))}
  }else{d.forEach(x=>html+=card(x))}
  nl.innerHTML=html;
}

function skel(){
  const s=document.getElementById('sk');s.style.display='block';
  s.innerHTML=Array(7).fill(0).map(()=>`<div class="sk-item">
    <div style="display:flex;gap:8px;margin-bottom:10px"><div class="sk" style="height:22px;width:55px;border-radius:9999px"></div><div class="sk" style="height:22px;width:65px"></div><div class="sk" style="height:22px;width:40px;margin-left:auto"></div></div>
    <div class="sk" style="height:21px;width:90%;margin-bottom:7px"></div><div class="sk" style="height:21px;width:70%;margin-bottom:11px"></div>
    <div class="sk" style="height:14px;width:100%;margin-bottom:5px"></div><div class="sk" style="height:14px;width:55%"></div>
  </div>`).join('');
}

const SYS=`You are a real-time global news editor. Search the web NOW for today's top news.

CRITICAL: Return ONLY a raw JSON array. No markdown. No backticks. No preamble. Start with [ end with ].

15-18 items. Categories: brk (breaking now), urg (urgent 24h), eco (economy), pol (politics), space (aerospace), ent (entertainment), sport (sports), game (gaming).

Short field names only:
{"c":"cat","h":"Chinese headline under 35 chars","s":"2 Chinese sentences","src":"outlet","r":"flag+place","t":"X小时前","i":4}

i=importance 1-5. Search for real current news.`;

async function load(){
  document.getElementById('wel').style.display='none';
  document.getElementById('err').style.display='none';
  document.getElementById('nl').innerHTML='';
  skel();
  const btn=document.getElementById('rbtn');
  btn.disabled=true;btn.textContent='加载中…';
  document.getElementById('ts').textContent='';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-beta':'web-search-2025-03-05'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4000,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        system:SYS,
        messages:[{role:'user',content:`Search web for today global news. ${new Date().toLocaleDateString('zh-CN')}. JSON only.`}]
      })
    });
    const data=await res.json();
    if(!res.ok)throw new Error(`HTTP ${res.status}: ${data.error?.message||'error'}`);
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const m=txt.match(/\[[\s\S]*\]/);
    if(!m)throw new Error('未找到数据\n'+txt.slice(0,300));
    const arr=JSON.parse(m[0]);
    if(!Array.isArray(arr)||!arr.length)throw new Error('数据为空');
    news=arr;
    document.getElementById('sk').style.display='none';
    const now=new Date();
    document.getElementById('ts').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' 更新';
    tabs();render();btn.textContent='刷新';
  }catch(e){
    console.error(e);
    document.getElementById('sk').style.display='none';
    document.getElementById('emsg').textContent=e.message;
    document.getElementById('err').style.display='block';
    btn.textContent=news.length?'刷新':'获取快讯';
    if(news.length){tabs();render()}
  }
  btn.disabled=false;
}
tabs();
</script>
</body>
</html>
