<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Budget</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#000;--card:#111;--card2:#18191b;--line:rgba(255,255,255,.095);
    --soft:rgba(255,255,255,.055);--text:#f5f6f8;--muted:#8f929a;
    --blue:#8fcaff;--blue2:#2ba7ff;--red:#ff4d61;--green:#54d6a1;
    --top:calc(64px + env(safe-area-inset-top));--dock:calc(68px + env(safe-area-inset-bottom));
  }
  html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;letter-spacing:0;overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:pan-y}
  body{max-width:620px;margin:0 auto}
  button,input,textarea{font:inherit}
  button{-webkit-tap-highlight-color:transparent}
  .topbar{position:fixed;z-index:30;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;height:var(--top);padding:calc(env(safe-area-inset-top) + 10px) 26px 10px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:#000;border-bottom:1px solid var(--line)}
  .avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#202226,#0d0d0e);display:grid;place-items:center;border:1px solid var(--line);font-size:18px}
  .title{text-align:center}.title strong{display:block;font-size:21px;line-height:1}.title span{display:block;margin-top:5px;color:var(--muted);font-size:13px;font-weight:800}
  .icon-btn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,#1c1d20,#0d0d0f);color:var(--text);display:grid;place-items:center;font-size:18px}
  .page{display:none;min-height:100dvh;padding:calc(var(--top) + 18px) 18px calc(var(--dock) + 18px)}
  .page.active{display:block}
  .section-title{font-size:42px;line-height:.95;margin:0 0 18px;font-weight:950;letter-spacing:0}
  .card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#151618,#0e0e0f);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);padding:22px;margin-bottom:16px;overflow:hidden}
  .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;font-weight:900;margin-bottom:8px}
  .hero{font-size:58px;line-height:.9;font-weight:950;letter-spacing:0;margin:0}.hero small{font-size:20px;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-weight:800}.pill{border:1px solid rgba(143,202,255,.38);background:rgba(143,202,255,.12);color:var(--blue);border-radius:999px;padding:8px 13px;font-weight:900;font-size:13px}
  .track{height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#f3f8ff,#5cb8ff);border-radius:inherit;transition:width .35s ease}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mini{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:12px}.mini span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.7px;font-weight:900}.mini strong{display:block;margin-top:5px;font-size:17px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field,.textarea{width:100%;border:1px solid var(--line);border-radius:20px;background:#101113;color:var(--text);outline:none;padding:16px 18px;font-weight:850}.textarea{min-height:108px;resize:vertical;line-height:1.45}.field:focus,.textarea:focus{border-color:rgba(143,202,255,.55);box-shadow:0 0 0 4px rgba(143,202,255,.08)}
  .primary{width:100%;border:0;border-radius:23px;background:linear-gradient(135deg,#f2f8ff,#55b9ff);color:#06101b;padding:17px 18px;font-size:18px;font-weight:950;box-shadow:0 16px 38px rgba(44,161,255,.2)}
  .ghost{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);color:var(--text);padding:13px 14px;font-weight:900}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);padding:12px 5px;text-align:center;color:var(--muted);font-weight:850}.cat.active{border-color:rgba(143,202,255,.55);background:rgba(143,202,255,.13);color:var(--blue)}
  .cat b{display:block;font-size:22px;margin-bottom:5px}.cat span{font-size:11px}
  .tx{position:relative;display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.txicon{width:42px;height:42px;border-radius:14px;background:#1b1d21;display:grid;place-items:center;font-size:20px}.txname{font-size:17px;font-weight:950}.txsub{font-size:13px;color:var(--muted);font-weight:800;margin-top:4px}.txamt{margin-left:auto;color:var(--red);font-weight:950;font-size:17px}.delete{border:0;background:rgba(255,77,97,.14);color:#ff8794;border-radius:14px;padding:10px 12px;font-weight:950}
  .drop{border:1px dashed rgba(143,202,255,.38);background:linear-gradient(180deg,rgba(143,202,255,.12),rgba(255,255,255,.035));border-radius:24px;padding:18px;text-align:center}.drop input{display:none}.drop strong{display:block;font-size:18px}.drop span{display:block;color:var(--muted);font-weight:800;margin-top:6px;font-size:13px}
  .ocrbox{display:none;margin-top:14px}.ocrbox.show{display:block}.ocr-text{white-space:pre-wrap;max-height:150px;overflow:auto;font-size:12px;color:var(--muted);line-height:1.45;border:1px solid var(--line);border-radius:16px;padding:12px;background:#0c0d0f}
  canvas{max-width:100%}.empty{color:var(--muted);font-weight:850;padding:24px 0;text-align:center}
  .tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;width:100%;max-width:620px;min-height:var(--dock);padding:6px 36px calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.72),#000 34%);border-top:1px solid rgba(255,255,255,.07)}
  .nav{height:52px;border:0;background:transparent;color:#8b8e96;display:grid;place-items:center;font-weight:900}.nav.active{color:var(--blue);filter:drop-shadow(0 0 14px rgba(143,202,255,.35))}.nav svg{width:28px;height:28px}.nav.add{width:64px;height:58px;border-radius:22px;background:linear-gradient(180deg,#25292d,#0f1113);border:1px solid rgba(255,255,255,.13);color:#fff;box-shadow:0 0 30px rgba(90,184,255,.18)}.nav.add.active{background:linear-gradient(180deg,#12304a,#0d1720);border-color:rgba(143,202,255,.32)}
</style>
</head>
<body>
  <header class="topbar">
    <div class="avatar">💳</div>
    <div class="title"><strong>Budget</strong><span id="cycle-label">—</span></div>
    <button class="icon-btn" onclick="renderAll()">↻</button>
  </header>

  <main id="home" class="page active">
    <section class="card">
      <div class="label">Remaining</div>
      <div class="row"><h1 class="hero" id="remaining">$0</h1><span class="pill" id="left-days">—</span></div>
      <div class="track" style="margin-top:18px"><div class="fill" id="budget-fill"></div></div>
      <div class="meta">
        <div class="mini"><span>Spent</span><strong id="spent">$0</strong></div>
        <div class="mini"><span>Daily</span><strong id="daily">$0</strong></div>
        <div class="mini"><span>Save</span><strong id="saving">$0</strong></div>
      </div>
    </section>
    <section class="card">
      <div class="row" style="margin-bottom:12px"><div><div class="label">Recent</div><h2 style="margin:0;font-size:25px">Transactions</h2></div><span class="pill" id="tx-count">0</span></div>
      <div id="recent"></div>
    </section>
  </main>

  <main id="add" class="page">
    <h1 class="section-title">Add<br>expense</h1>
    <section class="card">
      <div class="label">Screenshot OCR</div>
      <label class="drop">
        <input id="shot" type="file" accept="image/*" onchange="readScreenshot(this.files[0])">
        <strong>Upload receipt / bank screenshot</strong>
        <span id="ocr-status">OCR will pull amount, merchant and category.</span>
      </label>
      <div id="ocrbox" class="ocrbox">
        <div class="meta">
          <div class="mini"><span>Amount</span><strong id="ocr-amount">—</strong></div>
          <div class="mini"><span>Merchant</span><strong id="ocr-name">—</strong></div>
          <div class="mini"><span>Category</span><strong id="ocr-cat">—</strong></div>
        </div>
        <button class="primary" style="margin-top:12px" onclick="applyParsed()">Use this expense</button>
        <div class="ocr-text" id="ocr-text" style="margin-top:12px"></div>
      </div>
    </section>
    <section class="card">
      <div class="label">Quick text</div>
      <textarea id="quick" class="textarea" placeholder="Paste SMS, receipt text, or type: mcdonalds 12.5"></textarea>
      <button class="primary" style="margin-top:12px" onclick="parseQuick()">Estimate</button>
    </section>
    <section class="card">
      <div class="label">Manual</div>
      <div class="grid2">
        <input id="amount" class="field" type="number" placeholder="Amount" step="0.01">
        <input id="date" class="field" type="date">
      </div>
      <input id="desc" class="field" style="margin-top:12px" placeholder="Description">
      <div class="catgrid" id="catgrid" style="margin-top:12px"></div>
      <button class="primary" style="margin-top:14px" onclick="addManual()">Add to today</button>
    </section>
    <section class="card">
      <div class="row"><h2 style="margin:0">All records</h2><button class="ghost" onclick="clearText()">Clear text</button></div>
      <div id="history"></div>
    </section>
  </main>

  <main id="stats" class="page">
    <h1 class="section-title">Stats</h1>
    <section class="card"><div class="label">Daily spending</div><div style="height:210px"><canvas id="daily-chart"></canvas></div></section>
    <section class="card"><div class="label">Category</div><div style="height:220px"><canvas id="cat-chart"></canvas></div></section>
  </main>

  <nav class="tabs">
    <button class="nav active" data-tab="home" onclick="go('home')" aria-label="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <button class="nav add" data-tab="add" onclick="go('add')" aria-label="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav" data-tab="stats" onclick="go('stats')" aria-label="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></button>
  </nav>

<script>
const LIMIT=2500,CYCLE_DAY=28,KEY='bt_txs',SG_KEY='bt_sg';
const cats=[
  ['Food','🍔','#ff8f70',/(mcd|kfc|hungry|subway|woolworth|coles|aldi|iga|restaurant|cafe|food|饭|餐|麦当劳|肯德基|奶茶|外卖|寿司|面|burger|pizza)/i],
  ['Transport','🚗','#8fcaff',/(uber|taxi|train|bus|opal|petrol|bp|shell|transport|滴滴|地铁|公交|加油)/i],
  ['Shopping','🛍️','#c7b8ff',/(amazon|taobao|jd|kmart|target|myer|zara|uniqlo|shopping|mall|商场|淘宝|京东)/i],
  ['Entertain','🎮','#ffd27d',/(steam|cinema|hoyts|netflix|spotify|game|电影|游戏|娱乐)/i],
  ['Health','💊','#94e5c1',/(chemist|pharmacy|doctor|clinic|health|药|医院|诊所)/i],
  ['Education','📚','#9dc8ff',/(unsw|moodle|university|school|book|education|学费|学校|书)/i],
  ['Bills','📱','#ff8a9a',/(bill|water|electric|gas|internet|telstra|optus|账单|话费|电费)/i],
  ['Other','💰','#a8abb3',/.*/]
];
let txs=[],saving=1000,sel='Food',parsed=null,dailyChart=null,catChart=null;
try{txs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{txs=[]}
try{saving=+localStorage.getItem(SG_KEY)||1000}catch{}
const $=id=>document.getElementById(id);
const money=n=>'$'+Math.abs(+n||0).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(txs))}
function cycle(){const now=new Date();now.setHours(0,0,0,0);const s=now.getDate()>=CYCLE_DAY?new Date(now.getFullYear(),now.getMonth(),CYCLE_DAY):new Date(now.getFullYear(),now.getMonth()-1,CYCLE_DAY);const e=new Date(s);e.setMonth(e.getMonth()+1);return{start:s,end:e,left:Math.max(1,Math.ceil((e-now)/864e5)),passed:Math.max(0,Math.floor((now-s)/864e5))}}
function inCycle(){const c=cycle();return txs.filter(t=>{const d=new Date((t.date||today())+'T00:00:00');return d>=c.start&&d<c.end})}
function classify(text){return (cats.find(c=>c[3].test(text||''))||cats.at(-1))[0]}
function parseExpenseText(text){
  text=String(text||'').trim(); if(!text) return null;
  const moneyToken=/([0-9]{1,4}(?:,[0-9]{3})*(?:\.[0-9]{1,2})|[0-9]{1,5}(?:\.[0-9]{1,2})?)/g;
  const currencyAmounts=[...text.matchAll(/(?:AUD|A\$|\$|RMB|¥|人民币)\s*([0-9]{1,4}(?:,[0-9]{3})*(?:\.[0-9]{1,2})|[0-9]{1,5}(?:\.[0-9]{1,2})?)/gi)]
    .map(m=>+m[1].replace(/,/g,'')).filter(n=>n>0.5&&n<10000);
  const decimalAmounts=[...text.matchAll(moneyToken)].map(m=>m[1]).filter(raw=>raw.includes('.'))
    .map(raw=>+raw.replace(/,/g,'')).filter(n=>n>0.5&&n<10000);
  const looseAmounts=[...text.matchAll(moneyToken)].map(m=>({ raw:m[1], index:m.index || 0 })).filter(item=>{
    const n=+item.raw.replace(/,/g,'');
    const around=text.slice(Math.max(0,item.index-6), item.index + item.raw.length + 6);
    if (!(n>0.5&&n<10000)) return false;
    if (n>=1900 && n<=2099) return false;
    if (/\d{1,2}[:：]\d{2}/.test(around)) return false;
    if (/[-/.年月日]\s*$/.test(text.slice(0,item.index)) || /^\s*[-/.年月日]/.test(text.slice(item.index + item.raw.length))) return false;
    return true;
  }).map(item=>+item.raw.replace(/,/g,''));
  const pool=currencyAmounts.length?currencyAmounts:(decimalAmounts.length?decimalAmounts:looseAmounts);
  const amount=pool.length?Math.max(...pool):0;
  if(!amount)return null;
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const bad=/(total|amount|visa|mastercard|approved|receipt|date|time|subtotal|gst|aud|\$|rmb|balance|available|支付|交易|消费|扣款|金额)/i;
  const merchant=(lines.find(l=>l.length>2&&l.length<42&&!bad.test(l))||lines[0]||'Expense').replace(/[^\w\s\u4e00-\u9fa5&.'-]/g,' ').trim();
  const dateMatch=text.match(/(20\d{2})[-/年.](\d{1,2})[-/月.](\d{1,2})/)||text.match(/(\d{1,2})[-/月.](\d{1,2})/);
  let date=today();
  if(dateMatch){const y=dateMatch.length===4?dateMatch[1]:new Date().getFullYear();const m=dateMatch.length===4?dateMatch[2]:dateMatch[1];const d=dateMatch.length===4?dateMatch[3]:dateMatch[2];date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  return{amount,description:merchant||'Expense',category:classify(text+' '+merchant),date,raw:text};
}
function renderCats(){ $('catgrid').innerHTML=cats.map(c=>`<button class="cat ${sel===c[0]?'active':''}" onclick="sel='${c[0]}';renderCats()"><b>${c[1]}</b><span>${c[0]}</span></button>`).join('') }
function renderHome(){const c=cycle(),list=inCycle(),spent=list.reduce((s,t)=>s+(+t.amount||0),0),left=LIMIT-spent,pct=Math.min(100,spent/LIMIT*100);$('cycle-label').textContent=`${c.left} days left`;$('left-days').textContent=`${pct.toFixed(0)}% / $${LIMIT}`;$('remaining').textContent=(left<0?'-':'')+money(left);$('spent').textContent=money(spent);$('daily').textContent=money(Math.max(0,left/c.left));$('saving').textContent=money(Math.max(0,(left-saving)/c.left));$('budget-fill').style.width=pct+'%';$('tx-count').textContent=list.length+' items';$('recent').innerHTML=list.length?list.slice(0,8).map(row).join(''):'<div class="empty">No expenses yet.</div>'}
function row(t){const c=cats.find(x=>x[0]===t.category)||cats.at(-1);return`<div class="tx"><div class="txicon" style="color:${c[2]}">${c[1]}</div><div><div class="txname">${esc(t.description)}</div><div class="txsub">${esc(t.category)} · ${esc(t.date)}</div></div><div class="txamt">-${money(t.amount)}</div><button class="delete" onclick="delTx(${t.id})">Delete</button></div>`}
function renderHistory(){$('history').innerHTML=txs.length?txs.map(row).join(''):'<div class="empty">No records yet.</div>'}
function delTx(id){txs=txs.filter(t=>t.id!==id);save();renderAll()}
function addTx(data){txs.unshift({id:Date.now(),amount:+data.amount,description:data.description||'Expense',category:data.category||sel,date:data.date||today()});save();renderAll();go('home')}
function addManual(){const amount=+$('amount').value;if(!amount)return;addTx({amount,description:$('desc').value,category:sel,date:$('date').value||today()});$('amount').value='';$('desc').value=''}
function showParsed(p){parsed=p;$('ocrbox').classList.add('show');$('ocr-amount').textContent=money(p.amount);$('ocr-name').textContent=p.description;$('ocr-cat').textContent=p.category;$('ocr-text').textContent=p.raw||''}
function applyParsed(){if(parsed)addTx(parsed)}
function parseQuick(){const p=parseExpenseText($('quick').value);if(p)showParsed(p);else $('ocr-status').textContent='No amount found. Try a clearer screenshot or text.'}
async function readScreenshot(file){if(!file)return;$('ocr-status').textContent='Reading screenshot...';try{const res=await Tesseract.recognize(file,'eng+chi_sim',{logger:m=>{if(m.status)$('ocr-status').textContent=m.status.replace(/_/g,' ')}});const text=res.data.text||'';const p=parseExpenseText(text);if(p){showParsed(p);$('ocr-status').textContent='Screenshot parsed.'}else{$('ocrbox').classList.add('show');$('ocr-text').textContent=text;$('ocr-status').textContent='Text found, but amount needs manual check.'}}catch(e){$('ocr-status').textContent='OCR failed. Paste text instead.'}}
function clearText(){$('quick').value='';$('ocrbox').classList.remove('show');parsed=null}
function renderStats(){const list=inCycle(),c=cycle();const byDay=[];for(let i=0;i<=c.passed;i++){const d=new Date(c.start);d.setDate(d.getDate()+i);const key=d.toISOString().slice(0,10);byDay.push({label:(d.getMonth()+1)+'/'+d.getDate(),value:list.filter(t=>t.date===key).reduce((s,t)=>s+(+t.amount||0),0)})}if(dailyChart)dailyChart.destroy();dailyChart=new Chart($('daily-chart'),{type:'bar',data:{labels:byDay.map(x=>x.label),datasets:[{data:byDay.map(x=>x.value),backgroundColor:'#8fcaff',borderRadius:8}]},options:chartOptions()});const byCat=cats.map(c=>({label:c[0],color:c[2],value:list.filter(t=>t.category===c[0]).reduce((s,t)=>s+(+t.amount||0),0)})).filter(x=>x.value);if(catChart)catChart.destroy();catChart=new Chart($('cat-chart'),{type:'doughnut',data:{labels:byCat.map(x=>x.label),datasets:[{data:byCat.map(x=>x.value),backgroundColor:byCat.map(x=>x.color),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'66%',plugins:{legend:{labels:{color:'#8f929a'}}}}})}
function chartOptions(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8f929a'},grid:{display:false},border:{display:false}},y:{ticks:{color:'#8f929a'},grid:{color:'rgba(255,255,255,.07)'},border:{display:false}}}}}
function go(tab){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(tab).classList.add('active');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='stats')renderStats();if(tab==='add'){$('date').value=today();renderHistory();renderCats()}window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderCats();renderHome();renderHistory();if($('stats').classList.contains('active'))renderStats()}
$('date').value=today();renderAll();
</script>
</body>
</html>
