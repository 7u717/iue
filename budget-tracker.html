<body>
  <header class="topbar">
    <div class="avatar"><img src="icons/avatar.jpg" alt="avatar"></div>
    <div class="title"><strong>Vault</strong><span id="cycle-label">—</span></div>
    <button class="icon-btn" onclick="renderAll()">↻</button>
  </header>

  <main id="home" class="page active">
    <section class="card">
      <div class="label">Remaining</div>
      <div class="row"><h1 class="hero money-display" id="remaining">$0</h1><span class="pill" id="left-days">—</span></div>
      <div class="track" style="margin-top:18px"><div class="fill" id="budget-fill"></div></div>
      <div class="meta">
        <div class="mini"><span>Spent</span><strong id="spent">$0</strong></div>
        <div class="mini"><span>Free/day</span><strong id="daily">$0</strong></div>
        <div class="mini"><span>Save/day</span><strong id="saving">$0</strong></div>
      </div>
      <div class="goal-panel">
        <div><b>Savings goal</b><span>How much to keep this cycle</span></div>
        <label class="goal-input">$<input id="saving-goal" type="number" min="0" step="50" value="1000" onchange="setSavingGoal(this.value)" oninput="setSavingGoal(this.value)"></label>
      </div>
    </section>
    <section class="card">
      <div class="row" style="margin-bottom:12px"><div><div class="label">Recent</div><h2 style="margin:0;font-size:25px">Transactions</h2></div><span class="pill" id="tx-count">0</span></div>
      <div id="recent"></div>
    </section>
  </main>

  <main id="add" class="page">
    <h1 class="section-title">Log</h1>
    <section class="card sms-card">
      <div class="row" style="margin-bottom:10px"><div><div class="label">Smart entry</div><h2 style="margin:0;font-size:23px">Bank SMS</h2></div><span class="pill" id="sms-status">ready</span></div>
      <textarea id="sms-quick" class="textarea sms-input" placeholder="Paste bank SMS here" oninput="parseDashboardText()" onpaste="setTimeout(parseDashboardText,0)"></textarea>
      <small class="entry-hint" id="entry-hint"></small>
      <div id="sms-preview" class="sms-preview">
        <div class="sms-preview-head">
          <div class="sms-icon" id="sms-icon">💰</div>
          <div>
            <div class="sms-name" id="sms-name">—</div>
            <div class="sms-sub" id="sms-sub">—</div>
          </div>
          <div class="sms-amt" id="sms-amount">—</div>
        </div>
      </div>
    </section>
    <section class="card manual-card">
      <div class="label">Manual</div>
      <div class="manual-grid">
        <label class="manual-field"><span>Amount</span><input id="amount" class="field" type="number" placeholder="0.00" min="0" step="1"></label>
        <label class="manual-field"><span>Date</span><input id="date" class="field" type="date"></label>
        <label class="manual-field wide"><span>Description</span><input id="desc" class="field" placeholder="Description"></label>
      </div>
      <div class="catgrid" id="catgrid" style="margin-top:12px"></div>
      <button class="primary" style="margin-top:14px" onclick="addManual()">Add to today</button>
    </section>
    <section class="card">
      <div class="row"><h2 style="margin:0">All records</h2><span class="pill" id="history-count">0</span></div>
      <div id="history"></div>
    </section>
  </main>

  <main id="stats" class="page">
    <h1 class="section-title">Stats</h1>
    <section class="card">
      <div class="label">Cycle overview</div>
      <div class="stats-hero">
        <div>
          <div class="stats-number" id="stats-spent">$0</div>
          <div class="stats-caption" id="stats-caption">No spending yet.</div>
        </div>
        <span class="pill" id="stats-left">—</span>
      </div>

      </div>

    <section class="card chart-card"><div class="chart-head"><div class="chart-title">Daily spending</div><div class="chart-total" id="daily-total">$0</div></div><div style="height:220px"><canvas id="daily-chart"></canvas></div></section>
    <section class="card chart-card"><div class="chart-head"><div class="chart-title">Category mix</div><div class="chart-total" id="cat-total">$0</div></div><div style="height:228px"><canvas id="cat-chart"></canvas></div><div class="cat-list" id="cat-list"></div></section>

  </nav>

  $('sms-name').textContent=p.description;
  $('sms-sub').textContent=`${p.category} · ${p.date}`;
  $('sms-amount').textContent=(p.amount<0?'+':'-')+displayMoney(p);
  $('sms-amount').style.color=p.amount<0?'#67d9a5':'#ff7b88';
  fillManualFromParsed(p);
}
function parseDashboardText(){
  const value=$('sms-quick').value.trim();
  if(!value){clearDashboardText(false);return}
  const p=parseExpenseText(value);
  if(p)showDashboardParsed(p);
  else{$('sms-preview').classList.remove('show');$('sms-status').textContent='check';$('entry-hint').textContent='No amount found yet.'}
}
function clearDashboardText(clearInput=true){
  if(clearInput)$('sms-quick').value='';
  dashboardParsed=null;
  $('sms-preview').classList.remove('show');
  $('sms-status').textContent='ready';
  $('entry-hint').textContent='';
}
function applyDashboardParsed(){if(dashboardParsed){addTx(dashboardParsed);clearDashboardText()}}
function fillManualFromParsed(p){
  $('amount').value=Math.max(0,Math.abs(+p.amount||0)).toFixed(2);
  $('date').value=p.date||today();
  $('desc').value=p.description||'Expense';
  sel=(p.category==='Refund'?'Other':p.category)||classify(p.raw||p.description);
  renderCats();
  $('entry-hint').textContent='Filled into manual fields.';
}
async function tryClipboardFill(){
  if(!navigator.clipboard||!navigator.clipboard.readText)return;
  try{
    const text=(await navigator.clipboard.readText()).trim();
    if(!text||text===$('sms-quick').value.trim())return;
    const p=parseExpenseText(text);
    if(!p)return;
    $('sms-quick').value=text;
    showDashboardParsed(p);
  }catch{}
}
function parseQuick(){const p=parseExpenseText($('quick').value);if(p)showParsed(p);else $('ocr-status').textContent='No amount found. Try a clearer screenshot or text.'}
async function readScreenshot(file){if(!file)return;$('ocr-status').textContent='Reading screenshot...';try{const res=await Tesseract.recognize(file,'eng+chi_sim',{logger:m=>{if(m.status)$('ocr-status').textContent=m.status.replace(/_/g,' ')}});const text=res.data.text||'';const p=parseExpenseText(text);if(p){showParsed(p);$('ocr-status').textContent='Screenshot parsed.'}else{$('ocrbox').classList.add('show');$('ocr-text').textContent=text;$('ocr-status').textContent='Text found, but amount needs manual check.'}}catch(e){$('ocr-status').textContent='OCR failed. Paste text instead.'}}
function clearText(){$('quick').value='';$('ocrbox').classList.remove('show');parsed=null}
function renderStats(){
  const b=budgetState(),list=b.expenses,c=b.c,spent=b.spent,left=b.left,pct=b.spendable?Math.min(100,spent/b.spendable*100):100;
  const byDay=[];
  for(let i=0;i<=Math.max(c.passed,0);i++){
    const d=new Date(c.start);d.setDate(d.getDate()+i);
    const key=d.toISOString().slice(0,10);
    byDay.push({label:(d.getMonth()+1)+'/'+d.getDate(),value:list.filter(t=>t.date===key).reduce((s,t)=>s+audValue(t),0)});
  }
  const values=byDay.map(x=>x.value),high=Math.max(0,...values),avg=c.passed>=0?spent/(c.passed+1):0;
  $('stats-spent').textContent=money(spent);
  $('stats-caption').textContent=spent?`${pct.toFixed(0)}% of save-plan budget used, ${money(Math.max(0,b.saveLeft))} left for saving plan.`:'Paste a bank SMS or add your first expense.';
  $('stats-left').textContent=`${pct.toFixed(0)}% used`;
  $('stats-avg').textContent=money(avg);
  $('stats-high').textContent=money(high);
  $('stats-days').textContent=`${c.left} days`;
  $('daily-total').textContent=money(spent);
  if(dailyChart)dailyChart.destroy();
  dailyChart=new Chart($('daily-chart'),{type:'bar',data:{labels:byDay.map(x=>x.label),datasets:[{data:values,backgroundColor:(ctx)=>{const chart=ctx.chart,area=chart.chartArea;if(!area)return '#8fcaff';const g=chart.ctx.createLinearGradient(0,area.top,0,area.bottom);g.addColorStop(0,'#eaf5ff');g.addColorStop(.48,'#8fcaff');g.addColorStop(1,'#227cc3');return g},borderRadius:12,borderSkipped:false,barPercentage:.72,categoryPercentage:.72}]},options:chartOptions()});
  const byCat=cats.filter(c=>c[0]!=='Refund').map(c=>({label:c[0],icon:c[1],color:c[2],value:list.filter(t=>t.category===c[0]&&audValue(t)>0).reduce((s,t)=>s+audValue(t),0)})).filter(x=>x.value>0);
  $('cat-total').textContent=money(spent);
  $('cat-list').innerHTML=byCat.length?byCat.map(x=>`<div class="cat-row"><div class="cat-dot" style="color:${x.color}">${x.icon}</div><div><div class="cat-name">${x.label}</div><div class="cat-bar"><i style="width:${spent?Math.max(6,x.value/spent*100):0}%;background:${x.color}"></i></div></div><div class="cat-money">${money(x.value)}</div></div>`).join(''):'<div class="empty" style="padding:8px 0 0">No categories yet.</div>';
  if(catChart)catChart.destroy();
  catChart=new Chart($('cat-chart'),{type:'doughnut',data:{labels:byCat.map(x=>x.label),datasets:[{data:byCat.map(x=>x.value),backgroundColor:byCat.map(x=>x.color),borderColor:'#111',borderWidth:4,hoverOffset:8,spacing:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',animation:{animateRotate:true,animateScale:true,duration:780,easing:'easeOutQuart'},plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(16,17,19,.94)',titleColor:'#f5f6f8',bodyColor:'#aeb1b8',borderColor:'rgba(255,255,255,.12)',borderWidth:1,padding:12,cornerRadius:14,callbacks:{label:(ctx)=>`${ctx.label}: ${money(ctx.raw)}`}}}}})
}
function chartOptions(){return{responsive:true,maintainAspectRatio:false,animation:{duration:720,easing:'easeOutQuart'},plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(16,17,19,.94)',titleColor:'#f5f6f8',bodyColor:'#aeb1b8',borderColor:'rgba(255,255,255,.12)',borderWidth:1,padding:12,cornerRadius:14,callbacks:{label:(ctx)=>money(ctx.raw)}}},scales:{x:{ticks:{color:'#8f929a',maxRotation:0,autoSkip:true},grid:{display:false},border:{display:false}},y:{beginAtZero:true,ticks:{color:'#8f929a',callback:v=>'$'+v},grid:{color:'rgba(255,255,255,.06)'},border:{display:false}}}}}
function bindSwipeDeletes(){
  document.querySelectorAll('.swipe-row:not([data-bound])').forEach(row=>{
    row.dataset.bound='1';
    let startX=0,startY=0,last=0,dragging=false;
    const content=row.querySelector('.tx');
    row.addEventListener('pointerdown',e=>{
      if(e.target.closest('button'))return;
      closeSwipeRows(row);
      startX=e.clientX;startY=e.clientY;last=row.classList.contains('open')?-92:0;dragging=true;
      content.style.transition='none';
      row.setPointerCapture?.(e.pointerId);
    });
    row.addEventListener('pointermove',e=>{
      if(!dragging)return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10)return;
      const next=Math.max(-92,Math.min(0,last+dx));
      content.style.transform=`translateX(${next}px)`;
      row.dataset.offset=String(next);
      e.preventDefault();
    },{passive:false});
    const end=()=>{
      if(!dragging)return;
      dragging=false;
      content.style.transition='';
      const open=(+(row.dataset.offset||last))<-46;
      row.classList.toggle('open',open);
      content.style.transform='';
      row.dataset.offset='';
    };
    row.addEventListener('pointerup',end);
    row.addEventListener('pointercancel',end);
  });
}
function closeSwipeRows(except){document.querySelectorAll('.swipe-row.open').forEach(row=>{if(row!==except)row.classList.remove('open')})}
function go(tab){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(tab).classList.add('active');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='stats')renderStats();if(tab==='add'){$('date').value=today();renderHistory();renderCats();setTimeout(tryClipboardFill,80)}window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderCats();renderHome();renderHistory();if($('stats').classList.contains('active'))renderStats()}
$('date').value=today();renderAll();
</script>
