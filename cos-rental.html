<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>天天有鬼点子</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F6F4FF;
      --surface: #FFFFFF;
      --border: #E8E3FF;
      --text: #1A1028;
      --muted: #7B6FA0;
      --dim: #B8B0D0;
      --accent: #7C3AED;
      --accent-soft: rgba(124,58,237,0.08);
      --green: #059669;
      --green-soft: #ECFDF5;
      --red: #DC2626;
      --red-soft: #FEF2F2;
      --yellow: #D97706;
      --yellow-soft: #FFFBEB;
      --blue: #2563EB;
      --blue-soft: #EFF6FF;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; min-height: 100vh; padding-bottom: 80px; }

    /* HEADER */
    header {
      background: var(--accent); padding: 20px 20px 16px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .header-logo { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
    .header-date { font-size: 12px; color: rgba(255,255,255,0.7); }

    /* STATS ROW */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-card {
      background: rgba(255,255,255,0.15); border-radius: 12px;
      padding: 10px 12px; text-align: center;
    }
    .stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #fff; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 2px; }

    /* TABS */
    .tab-bar {
      display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 106px; z-index: 90;
    }
    .tab {
      flex: 1; padding: 13px 8px; font-size: 13px; font-weight: 500;
      color: var(--muted); cursor: pointer; text-align: center;
      border-bottom: 2px solid transparent; transition: all .2s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* SECTIONS */
    .section { display: none; padding: 16px 16px 20px; }
    .section.active { display: block; }

    /* FAB */
    .fab {
      position: fixed; bottom: 24px; right: 20px; z-index: 200;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); border: none; color: #fff;
      font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .fab:active { transform: scale(0.93); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 24px 24px 0 0;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      padding: 0 0 40px; animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 20px; }
    .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; padding: 0 20px 16px; }

    /* FORM */
    .form-group { padding: 0 20px; margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; letter-spacing: 0.04em; text-transform: uppercase; }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 15px; font-family: 'Inter', sans-serif;
      color: var(--text); background: var(--bg); outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--accent); background: #fff; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; margin-bottom: 14px; }
    .form-row .form-group { padding: 0; margin-bottom: 0; }

    .status-select {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .status-opt {
      padding: 7px 14px; border-radius: 100px; border: 1.5px solid var(--border);
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
      color: var(--muted);
    }
    .status-opt.selected { color: #fff; border-color: transparent; }
    .status-opt[data-val="待发货"].selected { background: var(--yellow); }
    .status-opt[data-val="已发货"].selected { background: var(--blue); }
    .status-opt[data-val="使用中"].selected { background: var(--accent); }
    .status-opt[data-val="已归还"].selected { background: var(--green); }
    .status-opt[data-val="已结束"].selected { background: var(--muted); }

    .btn-submit {
      width: calc(100% - 40px); margin: 16px 20px 0;
      background: var(--accent); color: #fff; border: none;
      padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: opacity .15s;
    }
    .btn-submit:hover { opacity: .88; }

    /* ORDER CARDS */
    .order-list { display: flex; flex-direction: column; gap: 10px; }
    .order-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .order-header {
      padding: 14px 16px; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px;
    }
    .order-name { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 3px; }
    .order-date { font-size: 12px; color: var(--muted); }
    .status-badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 100px; white-space: nowrap; flex-shrink: 0;
    }
    .s-待发货 { background: var(--yellow-soft); color: var(--yellow); }
    .s-已发货 { background: var(--blue-soft); color: var(--blue); }
    .s-使用中 { background: var(--accent-soft); color: var(--accent); }
    .s-已归还 { background: var(--green-soft); color: var(--green); }
    .s-已结束 { background: #F3F4F6; color: var(--muted); }

    .order-body {
      padding: 0 16px 14px;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; border-top: 1px solid var(--border);
    }
    .order-field { padding-top: 12px; }
    .field-label { font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
    .field-val { font-size: 14px; font-weight: 600; }
    .field-val.money { color: var(--accent); }
    .field-val.deposit-paid { color: var(--green); }
    .field-val.deposit-back { color: var(--muted); }

    .order-actions {
      padding: 10px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .action-btn {
      flex: 1; padding: 8px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; color: var(--muted);
      background: var(--bg); transition: all .15s;
    }
    .action-btn.primary { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .action-btn.danger { background: var(--red-soft); color: var(--red); border-color: transparent; }

    /* FILTER */
    .filter-bar {
      display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 7px 14px; border-radius: 100px; border: 1.5px solid var(--border);
      font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
      color: var(--muted); background: var(--surface); transition: all .15s; flex-shrink: 0;
    }
    .filter-chip.active { background: var(--text); border-color: var(--text); color: #fff; }

    /* STATS PAGE */
    .stats-section { padding: 16px; }
    .stats-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 12px;
    }
    .stats-card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
    .big-num { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; color: var(--accent); }
    .big-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .income-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .income-row:last-child { border-bottom: none; padding-bottom: 0; }
    .income-name { font-size: 14px; font-weight: 500; }
    .income-amount { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: var(--accent); }

    /* BAR CHART */
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 10px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--accent); min-height: 4px; transition: height .4s; }
    .bar-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .bar-val { font-size: 10px; font-weight: 600; color: var(--accent); }

    /* EMPTY */
    .empty { text-align: center; padding: 60px 24px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; }

    /* DEPOSIT STATUS */
    .deposit-toggle {
      display: flex; gap: 6px;
    }
    .dep-btn {
      flex: 1; padding: 7px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
      font-family: 'Inter', sans-serif; color: var(--muted); background: var(--bg);
      transition: all .15s;
    }
    .dep-btn.active-paid { background: var(--green-soft); color: var(--green); border-color: var(--green); }
    .dep-btn.active-back { background: #F3F4F6; color: var(--muted); border-color: var(--muted); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-top">
    <div class="header-logo">🎭 天天有鬼点子</div>
    <div class="header-date" id="header-date"></div>
  </div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-total-orders">0</div>
      <div class="stat-label">总订单</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-active">0</div>
      <div class="stat-label">进行中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">¥<span id="stat-income">0</span></div>
      <div class="stat-label">总收入</div>
    </div>
  </div>
</header>

<!-- TABS -->
<div class="tab-bar">
  <div class="tab active" onclick="showTab('orders')" id="tab-orders">📋 订单</div>
  <div class="tab" onclick="showTab('stats')" id="tab-stats">📊 收入</div>
</div>

<!-- ORDERS -->
<div class="section active" id="sec-orders">
  <div class="filter-bar" id="filter-bar">
    <div class="filter-chip active" onclick="setFilter('全部')">全部</div>
    <div class="filter-chip" onclick="setFilter('待发货')">⏳ 待发货</div>
    <div class="filter-chip" onclick="setFilter('已发货')">📦 已发货</div>
    <div class="filter-chip" onclick="setFilter('使用中')">✨ 使用中</div>
    <div class="filter-chip" onclick="setFilter('已归还')">✅ 已归还</div>
    <div class="filter-chip" onclick="setFilter('已结束')">🏁 已结束</div>
  </div>
  <div class="order-list" id="order-list">
    <div class="empty"><div class="empty-icon">🎭</div><div class="empty-text">还没有订单，点右下角➕添加</div></div>
  </div>
</div>

<!-- STATS -->
<div class="section" id="sec-stats">
  <div class="stats-card">
    <div class="stats-card-title">本月收入</div>
    <div class="big-num">¥<span id="month-income">0</span></div>
    <div class="big-sub" id="month-sub">暂无数据</div>
  </div>
  <div class="stats-card">
    <div class="stats-card-title">押金在途</div>
    <div class="big-num" style="color:var(--yellow);">¥<span id="deposit-holding">0</span></div>
    <div class="big-sub">未归还的押金总额</div>
  </div>
  <div class="stats-card">
    <div class="stats-card-title">近6个月趋势</div>
    <div class="bar-chart" id="bar-chart"></div>
  </div>
  <div class="stats-card">
    <div class="stats-card-title">收入明细（最近10笔）</div>
    <div id="income-list"><div style="color:var(--dim);font-size:14px;padding:12px 0;">暂无数据</div></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()">＋</button>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-inner">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">新增订单</div>

    <div class="form-group">
      <label class="form-label">角色 / 衣服名称</label>
      <input class="form-input" id="f-name" placeholder="例：小野寺小咲、伪恋女主..." type="text"/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">租期开始</label>
        <input class="form-input" id="f-start" type="date"/>
      </div>
      <div class="form-group">
        <label class="form-label">租期结束</label>
        <input class="form-input" id="f-end" type="date"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">租金（元）</label>
        <input class="form-input" id="f-price" type="number" placeholder="30"/>
      </div>
      <div class="form-group">
        <label class="form-label">押金（元）</label>
        <input class="form-input" id="f-deposit" type="number" placeholder="280"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">租客备注（可选）</label>
      <input class="form-input" id="f-note" placeholder="租客昵称、微信、特殊说明..."/>
    </div>

    <div class="form-group">
      <label class="form-label">订单状态</label>
      <div class="status-select" id="status-select">
        <div class="status-opt selected" data-val="待发货" onclick="selectStatus(this)">⏳ 待发货</div>
        <div class="status-opt" data-val="已发货" onclick="selectStatus(this)">📦 已发货</div>
        <div class="status-opt" data-val="使用中" onclick="selectStatus(this)">✨ 使用中</div>
        <div class="status-opt" data-val="已归还" onclick="selectStatus(this)">✅ 已归还</div>
        <div class="status-opt" data-val="已结束" onclick="selectStatus(this)">🏁 已结束</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">押金状态</label>
      <div class="deposit-toggle">
        <div class="dep-btn active-paid" id="dep-paid" onclick="setDeposit('paid')">💰 已收押金</div>
        <div class="dep-btn" id="dep-back" onclick="setDeposit('back')">↩️ 已退押金</div>
      </div>
    </div>

    <button class="btn-submit" id="modal-submit" onclick="submitOrder()">确认添加</button>
  </div>
</div>

<script>
// ============ FIREBASE CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyAdptT1R5q_zwF-Fe8wBtksXKArr5CogGA",
  authDomain: "iueprp.firebaseapp.com",
  projectId: "iueprp",
  storageBucket: "iueprp.firebasestorage.app",
  messagingSenderId: "613420164769",
  appId: "1:613420164769:web:2d8d268ccf5d6d1d1ab2e0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ordersCol = db.collection('cosOrders');

// ============ STATE ============
let orders = [];
let editingId = null;
let currentFilter = '全部';
let depositState = 'paid';

// 实时监听
ordersCol.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
  orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
}, (err) => {
  console.error('Firebase error:', err);
  document.getElementById('order-list').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">连接失败，请检查网络或刷新页面</div></div>';
});

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

async function saveOrder(order) {
  try {
    await ordersCol.doc(order.id).set(order);
  } catch(e) {
    alert('保存失败：' + e.message);
  }
}

async function removeOrder(id) {
  try {
    await ordersCol.doc(id).delete();
  } catch(e) {
    alert('删除失败：' + e.message);
  }
}

// ============ MODAL ============
function openModal(id = null) {
  editingId = id;
  const modal = document.getElementById('modal');
  const title = document.getElementById('modal-title');
  const submitBtn = document.getElementById('modal-submit');

  if (id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    title.textContent = '编辑订单';
    submitBtn.textContent = '保存修改';
    document.getElementById('f-name').value = o.name;
    document.getElementById('f-start').value = o.start;
    document.getElementById('f-end').value = o.end;
    document.getElementById('f-price').value = o.price;
    document.getElementById('f-deposit').value = o.deposit;
    document.getElementById('f-note').value = o.note || '';
    document.querySelectorAll('.status-opt').forEach(el => {
      el.classList.toggle('selected', el.dataset.val === o.status);
    });
    depositState = o.depositBack ? 'back' : 'paid';
  } else {
    title.textContent = '新增订单';
    submitBtn.textContent = '确认添加';
    document.getElementById('f-name').value = '';
    document.getElementById('f-start').value = '';
    document.getElementById('f-end').value = '';
    document.getElementById('f-price').value = '';
    document.getElementById('f-deposit').value = '';
    document.getElementById('f-note').value = '';
    document.querySelectorAll('.status-opt').forEach((el, i) => el.classList.toggle('selected', i === 0));
    depositState = 'paid';
  }
  updateDepositUI();
  modal.classList.add('open');
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function selectStatus(el) {
  document.querySelectorAll('.status-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}

function setDeposit(val) {
  depositState = val;
  updateDepositUI();
}
function updateDepositUI() {
  document.getElementById('dep-paid').className = 'dep-btn' + (depositState === 'paid' ? ' active-paid' : '');
  document.getElementById('dep-back').className = 'dep-btn' + (depositState === 'back' ? ' active-back' : '');
}

async function submitOrder() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { document.getElementById('f-name').style.borderColor = '#DC2626'; return; }
  document.getElementById('f-name').style.borderColor = '';

  const statusEl = document.querySelector('.status-opt.selected');
  const order = {
    id: editingId || genId(),
    name,
    start: document.getElementById('f-start').value,
    end: document.getElementById('f-end').value,
    price: parseFloat(document.getElementById('f-price').value) || 0,
    deposit: parseFloat(document.getElementById('f-deposit').value) || 0,
    note: document.getElementById('f-note').value.trim(),
    status: statusEl ? statusEl.dataset.val : '待发货',
    depositBack: depositState === 'back',
    createdAt: editingId ? (orders.find(x=>x.id===editingId)||{}).createdAt : new Date().toISOString(),
  };

  closeModal();
  await saveOrder(order);
}

async function deleteOrder(id) {
  if (!confirm('确认删除这个订单吗？')) return;
  await removeOrder(id);
}

async function updateStatus(id, status) {
  const o = orders.find(x => x.id === id);
  if (o) { await saveOrder({ ...o, status }); }
}

async function toggleDeposit(id) {
  const o = orders.find(x => x.id === id);
  if (o) { await saveOrder({ ...o, depositBack: !o.depositBack }); }
}

// ============ RENDER ============
function renderAll() {
  renderOrders();
  renderStats();
  renderHeader();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.replace(/^[^\s]+ /, '') === f || (f === '全部' && el.textContent === '全部'));
  });
  renderOrders();
}

function renderOrders() {
  const list = document.getElementById('order-list');
  let filtered = currentFilter === '全部' ? orders : orders.filter(o => o.status === currentFilter);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🎭</div><div class="empty-text">${currentFilter === '全部' ? '还没有订单，点右下角➕添加' : '没有' + currentFilter + '的订单'}</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const dateStr = o.start && o.end ? `${o.start} → ${o.end}` : o.start || '未填写租期';
    const nextStatus = { '待发货':'已发货', '已发货':'使用中', '使用中':'已归还', '已归还':'已结束', '已结束': null }[o.status];
    return `
      <div class="order-card">
        <div class="order-header">
          <div>
            <div class="order-name">${o.name}</div>
            <div class="order-date">📅 ${dateStr}${o.note ? ' · ' + o.note : ''}</div>
          </div>
          <div class="status-badge s-${o.status}">${o.status}</div>
        </div>
        <div class="order-body">
          <div class="order-field">
            <div class="field-label">租金</div>
            <div class="field-val money">¥${o.price}</div>
          </div>
          <div class="order-field">
            <div class="field-label">押金</div>
            <div class="field-val ${o.depositBack ? 'deposit-back' : 'deposit-paid'}">¥${o.deposit}${o.depositBack ? '（已退）' : '（在手）'}</div>
          </div>
          <div class="order-field">
            <div class="field-label">押金操作</div>
            <div class="field-val" style="cursor:pointer;" onclick="toggleDeposit('${o.id}')">${o.depositBack ? '↩️ 已退' : '💰 未退'}</div>
          </div>
        </div>
        <div class="order-actions">
          ${nextStatus ? `<button class="action-btn primary" onclick="updateStatus('${o.id}','${nextStatus}')">→ ${nextStatus}</button>` : ''}
          <button class="action-btn" onclick="openModal('${o.id}')">✏️ 编辑</button>
          <button class="action-btn danger" onclick="deleteOrder('${o.id}')">🗑️</button>
        </div>
      </div>`;
  }).join('');
}

function renderHeader() {
  const active = orders.filter(o => ['待发货','已发货','使用中'].includes(o.status)).length;
  const income = orders.reduce((s, o) => s + o.price, 0);
  document.getElementById('stat-total-orders').textContent = orders.length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-income').textContent = income;
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
}

function renderStats() {
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthOrders = orders.filter(o => (o.start || '').startsWith(thisMonth));
  const monthIncome = monthOrders.reduce((s, o) => s + o.price, 0);
  document.getElementById('month-income').textContent = monthIncome;
  document.getElementById('month-sub').textContent = monthOrders.length > 0 ? `本月共 ${monthOrders.length} 笔订单` : '本月暂无订单';

  const depositHolding = orders.filter(o => !o.depositBack).reduce((s,o) => s + o.deposit, 0);
  document.getElementById('deposit-holding').textContent = depositHolding;

  // Bar chart: last 6 months
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = `${d.getMonth()+1}月`;
    const income = orders.filter(o => (o.start||'').startsWith(key)).reduce((s,o) => s+o.price, 0);
    months.push({ label, income });
  }
  const maxIncome = Math.max(...months.map(m => m.income), 1);
  document.getElementById('bar-chart').innerHTML = months.map(m => `
    <div class="bar-col">
      <div class="bar-val">¥${m.income||''}</div>
      <div class="bar" style="height:${Math.max(m.income/maxIncome*90, m.income>0?8:2)}px;opacity:${m.income>0?1:0.2};"></div>
      <div class="bar-label">${m.label}</div>
    </div>`).join('');

  // Income list
  const recent = [...orders].sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0)).slice(0, 10);
  const incList = document.getElementById('income-list');
  if (recent.length === 0) { incList.innerHTML = '<div style="color:var(--dim);font-size:14px;padding:12px 0;">暂无数据</div>'; return; }
  incList.innerHTML = recent.map(o => `
    <div class="income-row">
      <div>
        <div class="income-name">${o.name}</div>
        <div style="font-size:12px;color:var(--dim);">${o.start||'未填写'} · <span class="status-badge s-${o.status}" style="font-size:10px;">${o.status}</span></div>
      </div>
      <div class="income-amount">¥${o.price}</div>
    </div>`).join('');
}

// ============ TABS ============
function showTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

// 初始化日期
document.getElementById('header-date').textContent = new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
</script>
</body>
</html>
